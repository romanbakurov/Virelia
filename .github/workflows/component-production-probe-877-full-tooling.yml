name: Component Production Contract Full Tooling Probe 877

on:
  push:
    branches:
      - chore/component-production-probe-877

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/component-production-contract-877
          fetch-depth: 0
      - name: Guard exact production-contract head
        run: test "$(git rev-parse HEAD)" = "06efa93ba847a6dfafdc1ead219c3f6a086735cd"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Quality
        run: pnpm ci:quality
      - name: Workspace build
        run: pnpm ci:build
      - name: Tooling typecheck
        run: pnpm typecheck:tooling
      - name: Full tooling tests
        run: pnpm test:tooling
