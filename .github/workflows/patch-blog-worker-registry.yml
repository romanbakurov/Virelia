name: Patch Blog Worker Registry Generator

on:
  push:
    branches:
      - feat/website-cloudflare-staging
    paths:
      - '.github/workflows/patch-blog-worker-registry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/website-cloudflare-staging

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Patch generated registry contract
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('scripts/blog/tooling.ts')
          source = path.read_text()
          start = source.index('export function buildBlogArticleRegistry(')
          end = source.index('\nfunction buildDraftMetadata', start)
          replacement = r'''function metadataImportIdentifier(slug: string): string {
            const [first = '', ...rest] = slug.split('-');
            return `${first}${rest
              .map((part) => `${part.slice(0, 1).toUpperCase()}${part.slice(1)}`)
              .join('')}Metadata`;
          }

          export function buildBlogArticleRegistry(slugs: readonly string[]): string {
            const normalizedSlugs = [...slugs].sort((left, right) =>
              left.localeCompare(right)
            );
            const metadataImports = normalizedSlugs.map((slug) =>
              `import ${metadataImportIdentifier(slug)} from '../../content/blog/${slug}/metadata.json';`
            );
            const metadataEntries = normalizedSlugs.map(
              (slug) =>
                `  { slug: '${slug}', metadata: ${metadataImportIdentifier(slug)} },`
            );
            const loaderEntries = normalizedSlugs.map(
              (slug) =>
                `    '${slug}': () => import('../../content/blog/${slug}/article.mdx'),`
            );
            const metadataRegistryBody =
              metadataEntries.length === 0
                ? '  [] as const satisfies readonly BlogArticleMetadataRegistryEntry[];'
                : `  [\n${metadataEntries.join('\n')}\n  ] as const satisfies readonly BlogArticleMetadataRegistryEntry[];`;
            const loaderRegistryBody =
              loaderEntries.length === 0
                ? '  {};'
                : `  {\n${loaderEntries.join('\n')}\n  };`;

            return [
              "import type { ComponentType } from 'react';",
              ...(metadataImports.length > 0 ? ['', ...metadataImports] : []),
              '',
              'export interface BlogMDXModule {',
              '  default: ComponentType;',
              '}',
              '',
              'export type BlogMDXModuleLoader = () => Promise<BlogMDXModule>;',
              '',
              'export interface BlogArticleMetadataRegistryEntry {',
              '  slug: string;',
              '  metadata: unknown;',
              '}',
              '',
              '/**',
              ' * Generated by Blog V1 authoring tooling.',
              ' *',
              ' * Keep MDX and metadata imports statically analyzable for Next.js/Turbopack',
              ' * and Cloudflare Workers. Runtime rendering must not depend on repository fs.',
              ' */',
              'const blogArticleMetadataRegistryEntries =',
              metadataRegistryBody,
              '',
              'const blogArticleModuleLoaders: Readonly<Record<string, BlogMDXModuleLoader>> =',
              loaderRegistryBody,
              '',
              'export function getBlogArticleMetadataRegistryEntries(): readonly BlogArticleMetadataRegistryEntry[] {',
              '  return blogArticleMetadataRegistryEntries;',
              '}',
              '',
              'export function getBlogArticleModuleLoader(',
              '  slug: string',
              '): BlogMDXModuleLoader | null {',
              '  return blogArticleModuleLoaders[slug] ?? null;',
              '}',
              '',
            ].join('\n');
          }
          '''
          path.write_text(source[:start] + replacement + source[end:])
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate blog registry
        run: |
          pnpm exec prettier scripts/blog/tooling.ts apps/website/src/blog/article-modules.ts apps/website/src/blog/store.ts --write
          pnpm blog:check
          pnpm test:blog
          pnpm website:typecheck

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-blog-worker-registry.yml
          git add scripts/blog/tooling.ts apps/website/src/blog/article-modules.ts apps/website/src/blog/store.ts
          git commit -m 'fix(blog): make runtime corpus worker-safe'
          git push origin HEAD:feat/website-cloudflare-staging
