name: Component Production Format Regressions 877

on:
  push:
    branches:
      - chore/component-production-probe-877

permissions:
  contents: write

jobs:
  format-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/component-production-contract-877
          fetch-depth: 0
      - name: Guard exact production-contract head
        run: test "$(git rev-parse HEAD)" = "fb0d1d60ab211ad93b1a2dcefac04fcaff22bf22"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format dependency preflight
        run: pnpm exec prettier scripts/generators/component/preflight.ts --write
      - name: Verify formatting
        run: pnpm exec prettier scripts/generators/component/preflight.ts --check
      - name: Verify exact changed-file scope
        shell: bash
        run: test "$(git diff --name-only)" = "scripts/generators/component/preflight.ts"
      - name: Targeted regression tests
        run: pnpm exec vitest run --config vitest.tooling.config.ts scripts/generators/component/production-preflight-contract.test.ts scripts/generators/component/production-plan-normalization.test.ts
      - name: Workspace build
        run: pnpm ci:build
      - name: Tooling typecheck
        run: pnpm typecheck:tooling
      - name: Diff safety
        run: git diff --check
      - name: Re-check production branch guard
        shell: bash
        run: |
          git fetch origin feat/component-production-contract-877
          test "$(git rev-parse origin/feat/component-production-contract-877)" = "fb0d1d60ab211ad93b1a2dcefac04fcaff22bf22"
      - name: Commit and push formatting only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generators/component/preflight.ts
          git commit -m "style(generator): format dependency preflight"
          git push origin HEAD:feat/component-production-contract-877
