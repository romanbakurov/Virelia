name: Token Preservation Bootstrap

on:
  pull_request:
    paths:
      - 'packages/tokens/**'
      - '.github/workflows/token-preservation-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format preservation sources
        run: >-
          pnpm prettier
          packages/tokens/scripts/token-preservation-cli.ts
          packages/tokens/scripts/token-preservation.test.ts
          packages/tokens/scripts/token-preservation.ts
          packages/tokens/src/preservation/token-migrations.ts
          --write
      - name: Generate preservation baseline
        run: pnpm --filter @vellira-ui/tokens preservation:baseline
      - name: Commit exact bootstrap output and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/tokens/scripts/token-preservation-cli.ts \
            packages/tokens/scripts/token-preservation.test.ts \
            packages/tokens/scripts/token-preservation.ts \
            packages/tokens/src/preservation/token-migrations.ts \
            packages/tokens/src/preservation/token-preservation-baseline.v1.json
          git rm .github/workflows/token-preservation-bootstrap.yml
          git commit -m "test(tokens): record resolved preservation baseline"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
