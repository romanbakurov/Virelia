name: Probe Cloudflare Blog Metrics

on:
  push:
    branches:
      - feat/website-cloudflare-staging
    paths:
      - '.github/workflows/probe-cloudflare-blog-metrics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe same-origin actor metrics
        shell: bash
        env:
          STAGING_URL: https://vellira-website-staging.vellira.workers.dev
          API_URL: https://api.vellira.dev
          SLUG: two-runtimes
        run: |
          set -euo pipefail

          request() {
            local name="$1"
            shift
            local body="/tmp/${name}.body"
            local headers="/tmp/${name}.headers"
            local status

            status="$(curl --silent --show-error --max-time 20 \
              --dump-header "$headers" \
              --output "$body" \
              --write-out '%{http_code}' \
              "$@")"

            echo "=== $name HTTP $status ==="
            sed -n '1,30p' "$headers"
            cat "$body"
            echo

            if [[ "$status" != "200" ]]; then
              echo "$name failed with HTTP $status" >&2
              return 1
            fi
          }

          request direct-like \
            "$API_URL/v1/blog/articles/$SLUG/like"

          jar=/tmp/actor.cookies
          proxy="$STAGING_URL/api/blog-metrics/articles/$SLUG"

          request proxy-like-1 \
            --cookie-jar "$jar" --cookie "$jar" \
            "$proxy/like"
          request proxy-like-2 \
            --cookie-jar "$jar" --cookie "$jar" \
            "$proxy/like"

          request view-1 \
            --request POST \
            --cookie-jar "$jar" --cookie "$jar" \
            "$proxy/views"
          request view-2 \
            --request POST \
            --cookie-jar "$jar" --cookie "$jar" \
            "$proxy/views"

          request like-put-1 \
            --request PUT \
            --cookie-jar "$jar" --cookie "$jar" \
            "$proxy/like"
          request like-put-2 \
            --request PUT \
            --cookie-jar "$jar" --cookie "$jar" \
            "$proxy/like"

          python3 - <<'PY'
          import json
          from pathlib import Path

          def load(name):
              return json.loads(Path(f'/tmp/{name}.body').read_text())

          first_view = load('view-1')['metrics']['views']
          second_view = load('view-2')['metrics']['views']
          if first_view != second_view:
              raise SystemExit(
                  f'view idempotency failed: first={first_view} second={second_view}'
              )

          first_like = load('like-put-1')
          second_like = load('like-put-2')
          if first_like['metrics']['likes'] != second_like['metrics']['likes']:
              raise SystemExit(
                  'like count changed on repeated PUT: '
                  f"first={first_like['metrics']['likes']} "
                  f"second={second_like['metrics']['likes']}"
              )
          if second_like.get('changed') is not False or second_like.get('liked') is not True:
              raise SystemExit(f'repeated PUT was not idempotent: {second_like!r}')

          print(
              'OK stable actor: repeated view is a no-op and repeated like PUT is idempotent'
          )
          PY

          request like-restore \
            --request DELETE \
            --cookie-jar "$jar" --cookie "$jar" \
            "$proxy/like"
