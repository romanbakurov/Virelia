name: Token State Vocabulary Audit

on:
  push:
    branches:
      - refactor/token-state-vocabulary-v1

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Audit state mappings
        shell: bash
        run: |
          set -euo pipefail
          echo '=== semantic/factory/template active and pressed declarations ==='
          grep -RInE \
            --include='*.ts' --include='*.tsx' \
            "(^|[[:space:]])(active|pressed|selectedActive|selectedPressed|itemActive|itemPressed|optionActive|optionPressed|triggerActive|triggerPressed|activeScale|pressedScale):|control\.active|selected\.active|\.active\.(bg|fg|border)|activeScale|pressedScale" \
            packages/tokens/src scripts/generators/component || true
          echo
          echo '=== runtime active / pressed token consumers ==='
          grep -RInE \
            --include='*.ts' --include='*.tsx' --include='*.scss' \
            "active-scale|pressed-scale|active-bg|pressed-bg|selected-active|selected-pressed|data-state=['\"]active|aria-selected|:active" \
            packages/react/src packages/react-native/src || true
