name: Submit URLs to IndexNow

run-name: >-
  IndexNow —
  ${{ github.event_name == 'workflow_dispatch'
    && 'manual main'
    || format('{0} / {1}', github.event.deployment_status.environment, github.event.deployment_status.state) }}

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    name: Submit production URLs
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}

      - name: Submit URLs to IndexNow
        run: node scripts/submit-indexnow.mjs