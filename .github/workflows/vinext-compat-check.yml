name: vinext initialization

on:
  push:
    branches:
      - feat/website-cloudflare-staging
    paths:
      - apps/website/**
      - packages/**
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .github/workflows/vinext-compat-check.yml

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/website-cloudflare-staging

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@11.20.0 --activate

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Initialize vinext for Cloudflare
        working-directory: apps/website
        run: >-
          pnpm dlx vinext@1.0.0-beta.9 init
          --skip-check
          --platform=cloudflare
          --cdn-cache=workers-cache
          --data-cache=none
          --image-optimization=cloudflare-images

      - name: Build workspace packages in dependency order
        run: pnpm build

      - name: Sync website brand
        working-directory: apps/website
        run: pnpm run sync:brand

      - name: Build with vinext
        working-directory: apps/website
        run: pnpm run build:vinext

      - name: Verify existing Next build
        working-directory: apps/website
        run: pnpm run build

      - name: Typecheck website
        working-directory: apps/website
        run: pnpm run typecheck

      - name: Review generated changes
        run: |
          git status --short
          git diff -- apps/website pnpm-lock.yaml

      - name: Commit vinext initialization
        run: |
          if git diff --quiet && test -z "$(git ls-files --others --exclude-standard apps/website)"; then
            echo "No vinext initialization changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/website pnpm-lock.yaml
          git commit -m "feat(website): initialize vinext for Cloudflare Workers"
          git push
