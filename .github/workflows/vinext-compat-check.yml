name: vinext compatibility check

on:
  push:
    branches:
      - feat/website-cloudflare-staging
    paths:
      - apps/website/**
      - packages/react/**
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .github/workflows/vinext-compat-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@11.20.0 --activate

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Run vinext compatibility check
        working-directory: apps/website
        run: pnpm dlx vinext@1.0.0-beta.9 check
