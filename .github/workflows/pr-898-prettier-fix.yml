name: PR 898 Prettier Fix

on:
  push:
    branches:
      - refactor/token-state-vocabulary-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/token-state-vocabulary-v1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only failing regression test
        run: pnpm prettier packages/tokens/src/token-state-vocabulary.test.ts --write
      - name: Commit format fix and remove temporary workflow
        run: |
          rm .github/workflows/pr-898-prettier-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/tokens/src/token-state-vocabulary.test.ts .github/workflows/pr-898-prettier-fix.yml
          if git diff --cached --quiet; then
            echo 'No formatting changes to commit'
            exit 1
          fi
          git commit -m 'style(tokens): format state vocabulary regression'
          git push origin HEAD:refactor/token-state-vocabulary-v1
