name: Materialize panel surface correction

on:
  push:
    branches:
      - fix/blog-code-block-light-surface-912

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/blog-code-block-light-surface-912

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reclassify remaining authored CSS consumers
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const path = 'apps/website/src/component-catalog/shared/ComponentsCatalog/ComponentsCatalog.module.css';
          let source = fs.readFileSync(path, 'utf8');

          const replacements = [
            [
              '.card {\n  position: relative;\n  display: flex;\n  min-width: 0;\n  aspect-ratio: 1.35 / 1;\n  flex-direction: column;\n  color: var(--text-primary);\n  background: var(--surface-canvas);',
              '.card {\n  position: relative;\n  display: flex;\n  min-width: 0;\n  aspect-ratio: 1.35 / 1;\n  flex-direction: column;\n  color: var(--text-primary);\n  background: var(--surface-panel);',
            ],
            [
              '.card:hover {\n  background: var(--surface-canvas);',
              '.card:hover {\n  background: var(--surface-panel);',
            ],
            [
              '.tooltipBubble {\n  position: absolute;\n  top: 0;\n  left: 50%;\n  padding: 7px 10px;\n  color: var(--surface-canvas);',
              '.tooltipBubble {\n  position: absolute;\n  top: 0;\n  left: 50%;\n  padding: 7px 10px;\n  color: var(--text-inverse);',
            ],
          ];

          for (const [from, to] of replacements) {
            if (!source.includes(from)) {
              throw new Error(`Expected migration anchor not found: ${from}`);
            }
            source = source.replace(from, to);
          }

          fs.writeFileSync(path, source);
          NODE

      - name: Regenerate token types
        run: pnpm --filter @vellira-ui/tokens generate:types

      - name: Format authored touched files
        run: |
          pnpm prettier \
            apps/website/src/blog/ui/BlogCodeBlock.module.css \
            apps/website/src/component-catalog/shared/ComponentExplorer/ComponentExplorer.module.css \
            apps/website/src/component-catalog/shared/ComponentNavigationShell/ComponentNavigationShell.module.css \
            apps/website/src/component-catalog/shared/ComponentsCatalog/ComponentsCatalog.module.css \
            apps/website/src/components/layout/SiteHeader/HeaderSearch/HeaderSearch.module.css \
            apps/website/src/components/navigation/Sidebar/Sidebar.module.css \
            docs/architecture/token-semantic-vocabulary-v1.md \
            packages/tokens/src/dark/semantic/surface.ts \
            packages/tokens/src/highContrast/semantic/surface.ts \
            packages/tokens/src/light/semantic/surface.ts \
            packages/tokens/src/preservation/token-migrations.ts \
            packages/tokens/src/semantic-vocabulary-v1.test.ts \
            packages/tokens/src/token-architecture.ts \
            scripts/blog/blog-code-block-theme.test.ts \
            --write

      - name: Focused validation
        run: |
          pnpm --filter @vellira-ui/tokens generate:types:check
          pnpm --filter @vellira-ui/tokens preservation:check
          pnpm --filter @vellira-ui/tokens build:tokens
          pnpm --filter @vellira-ui/tokens test
          pnpm test:blog

      - name: Materialize validated correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/panel-surface-materialize.yml
          git add \
            apps/website/src/blog/ui/BlogCodeBlock.module.css \
            apps/website/src/component-catalog/shared/ComponentExplorer/ComponentExplorer.module.css \
            apps/website/src/component-catalog/shared/ComponentNavigationShell/ComponentNavigationShell.module.css \
            apps/website/src/component-catalog/shared/ComponentsCatalog/ComponentsCatalog.module.css \
            apps/website/src/components/layout/SiteHeader/HeaderSearch/HeaderSearch.module.css \
            apps/website/src/components/navigation/Sidebar/Sidebar.module.css \
            docs/architecture/token-semantic-vocabulary-v1.md \
            packages/tokens/src/dark/semantic/surface.ts \
            packages/tokens/src/generated/token-types.ts \
            packages/tokens/src/highContrast/semantic/surface.ts \
            packages/tokens/src/light/semantic/surface.ts \
            packages/tokens/src/preservation/token-migrations.ts \
            packages/tokens/src/semantic-vocabulary-v1.test.ts \
            packages/tokens/src/token-architecture.ts \
            scripts/blog/blog-code-block-theme.test.ts
          git diff --cached --check
          git commit -m 'fix(tokens): complete panel surface migration'
          git push origin HEAD:fix/blog-code-block-light-surface-912
