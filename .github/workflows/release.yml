name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  issues: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: '@vellira-ui'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Quality checks
        run: pnpm ci:quality

      - name: Build packages and apps
        run: pnpm ci:build

      - name: Typecheck & API validation
        run: pnpm ci:typecheck

      - name: Install Playwright browsers
        run: pnpm ci:playwright

      - name: Tests and coverage
        run: pnpm ci:test

      - name: Smoke packages
        run: pnpm ci:smoke

      - name: Verify npm registry
        run: npm ping --registry=https://registry.npmjs.org

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

      - name: Create version sync PR
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            package.json
            pnpm-lock.yaml
            packages/*/package.json
          branch: chore/sync-release-versions
          commit-message: 'chore(release): sync package versions'
          delete-branch: true
          title: 'chore(release): sync package versions'
          body: |
            Sync package manifests and lockfile with the version prepared by semantic-release.
