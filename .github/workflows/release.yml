name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  issues: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: '@vellira-ui'

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Quality checks
        run: pnpm ci:quality

      - name: Build packages and apps
        run: pnpm ci:build

      - name: Typecheck & API validation
        run: pnpm ci:typecheck

      - name: Install Playwright browsers
        run: pnpm ci:playwright

      - name: Tests and coverage
        run: pnpm ci:test

      - name: Smoke packages
        run: pnpm ci:smoke

      - name: Verify npm registry
        run: npm ping --registry=https://registry.npmjs.org

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

      - name: Verify release sync token
        env:
          RELEASE_SYNC_TOKEN: ${{ secrets.RELEASE_SYNC_TOKEN }}
        run: |
          if [ -z "$RELEASE_SYNC_TOKEN" ]; then
            echo "RELEASE_SYNC_TOKEN secret is required to create the version sync PR as a maintainer."
            exit 1
          fi

      - name: Create version sync PR
        id: version-sync-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.RELEASE_SYNC_TOKEN }}
          add-paths: |
            package.json
            pnpm-lock.yaml
            packages/*/package.json
          branch: chore/sync-release-versions
          commit-message: 'chore(release): sync package versions'
          delete-branch: true
          title: 'chore(release): sync package versions'
          body: |
            Sync package manifests and lockfile with the version prepared by semantic-release.

      - name: Enable auto-merge for version sync PR
        if: steps.version-sync-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SYNC_TOKEN }}
        run: |
          gh pr merge ${{ steps.version-sync-pr.outputs.pull-request-number }} \
            --auto \
            --squash \
            --delete-branch
