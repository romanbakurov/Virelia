name: Source Hygiene Branch Repair

on:
  push:
    branches:
      - chore/source-health-817

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/source-health-817

      - name: Apply deterministic source-hygiene repairs
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              if old in text:
                  file_path.write_text(text.replace(old, new, 1))
                  return
              if new in text:
                  return
              raise SystemExit(f"Expected old or repaired block not found in {path}")

          replace_once(
              'packages/react/src/components/Dropdown/Dropdown.stories.tsx',
              """import { Button } from '../../primitives/Button';
          import { Portal } from '../../primitives/Portal';

          import { Dropdown } from './Dropdown';
          """,
              """import { Dropdown } from './Dropdown';

          import { Button } from '#primitives/Button';
          import { Portal } from '#primitives/Portal';
          """,
          )

          replace_once(
              'packages/react/src/components/Dropdown/Dropdown.test.tsx',
              """import { waitFor } from '@testing-library/react';
          import { copyCompoundSlotMetadata } from '@vellira-ui/core';
          import type { ComponentProps } from 'react';
          import { afterEach, describe, expect, it, vi } from 'vitest';

          import { Button } from '../../primitives/Button';
          import { Portal } from '../../primitives/Portal';
          import { expectNoA11yViolations } from '../../test-utils/a11y';
          import { render } from '../../test-utils/render';

          import { Dropdown } from './Dropdown';

          import contentStyles from './Content/DropdownContent.module.scss';
          import itemStyles from './Item/DropdownItem.module.scss';
          import triggerStyles from './Trigger/DropdownTrigger.module.scss';
          """,
              """import { expectNoA11yViolations } from '@test-utils/a11y';
          import { render } from '@test-utils/render';
          import { waitFor } from '@testing-library/react';
          import { copyCompoundSlotMetadata } from '@vellira-ui/core';
          import type { ComponentProps } from 'react';
          import { afterEach, describe, expect, it, vi } from 'vitest';

          import { Dropdown } from './Dropdown';

          import contentStyles from './Content/DropdownContent.module.scss';
          import itemStyles from './Item/DropdownItem.module.scss';
          import triggerStyles from './Trigger/DropdownTrigger.module.scss';

          import { Button } from '#primitives/Button';
          import { Portal } from '#primitives/Portal';
          """,
          )

          replace_once(
              'packages/react/src/components/Modal/Modal.stories.tsx',
              """import { Button } from '../../primitives/Button';
          import { Input } from '../../primitives/Input';
          import { Portal } from '../../primitives/Portal';
          import { Radio } from '../../primitives/Radio';
          import { RadioGroup } from '../RadioGroup';

          import { Modal } from './Modal';
          """,
              """import { RadioGroup } from '../RadioGroup';

          import { Modal } from './Modal';

          import { Button } from '#primitives/Button';
          import { Input } from '#primitives/Input';
          import { Portal } from '#primitives/Portal';
          import { Radio } from '#primitives/Radio';
          """,
          )

          replace_once(
              'packages/react/src/components/Select/Select.test.tsx',
              """import { copyCompoundSlotMetadata } from '@vellira-ui/core';
          import type { ComponentProps, ReactNode } from 'react';
          import { afterEach, describe, expect, it, vi } from 'vitest';

          import { FormField } from '../../patterns/FormField';
          import { expectNoA11yViolations } from '../../test-utils/a11y';

          import { Select } from './Select';
          import type {
            SelectRenderOptionContext,
            SelectRenderValueContext,
          } from './types';
          """,
              """import { expectNoA11yViolations } from '@test-utils/a11y';
          import { copyCompoundSlotMetadata } from '@vellira-ui/core';
          import type { ComponentProps, ReactNode } from 'react';
          import { afterEach, describe, expect, it, vi } from 'vitest';

          import { Select } from './Select';
          import type {
            SelectRenderOptionContext,
            SelectRenderValueContext,
          } from './types';

          import { FormField } from '#patterns/FormField';
          """,
          )

          replace_once(
              'packages/react/src/components/Tooltip/Tooltip.stories.tsx',
              """import { Button } from '../../primitives/Button';
          import { Portal } from '../../primitives/Portal';

          import { Tooltip } from './Tooltip';
          """,
              """import { Tooltip } from './Tooltip';

          import { Button } from '#primitives/Button';
          import { Portal } from '#primitives/Portal';
          """,
          )

          replace_once(
              'packages/react/src/primitives/Input/Input.stories.tsx',
              """import { FormField } from '../../patterns/FormField';
          import { Input } from '../Input';

          import type { InputProps } from './types';
          """,
              """import { Input } from '../Input';

          import type { InputProps } from './types';

          import { FormField } from '#patterns/FormField';
          """,
          )

          finding_block = """
          function finding(
            rule: ComponentQualityRule,
            context: ComponentQualityRuleContext,
            status: ComponentQualityFinding['status'],
            message?: string,
            evidence?: readonly string[]
          ): ComponentQualityFinding {
            return {
              ruleId: rule.definition.id,
              dimension: rule.definition.dimension,
              severity: rule.definition.severity,
              evaluation: rule.definition.evaluation,
              status,
              platform: context.platform,
              message,
              evidence,
            };
          }
          """

          rule_files = [
              'scripts/checks/component-quality/rules/api-feature.ts',
              'scripts/checks/component-quality/rules/platform-accessibility.ts',
              'scripts/checks/component-quality/rules/conformity.ts',
              'scripts/checks/component-quality/rules/coverage.ts',
          ]
          for path in rule_files:
              file_path = Path(path)
              text = file_path.read_text()
              repaired_import = "import { createRuleFinding as finding } from './finding';"
              if finding_block in text:
                  text = text.replace(finding_block, '\n', 1)
              elif repaired_import not in text:
                  raise SystemExit(f"Expected finding helper or repaired import not found in {path}")

              text = text.replace('  ComponentQualityFinding,\n', '', 1)
              marker = "} from '../types';\n"
              if repaired_import not in text:
                  if marker not in text:
                      raise SystemExit(f"Expected types import not found in {path}")
                  text = text.replace(
                      marker,
                      marker + "\n" + repaired_import + "\n",
                      1,
                  )
              file_path.write_text(text)

          Path('scripts/checks/component-quality/rules/finding.ts').write_text(
              """import type { ComponentQualityFinding } from '@vellira-ui/metadata';

          import type {
            ComponentQualityRule,
            ComponentQualityRuleContext,
          } from '../types';

          export function createRuleFinding(
            rule: ComponentQualityRule,
            context: ComponentQualityRuleContext,
            status: ComponentQualityFinding['status'],
            message?: string,
            evidence?: readonly string[]
          ): ComponentQualityFinding {
            return {
              ruleId: rule.definition.id,
              dimension: rule.definition.dimension,
              severity: rule.definition.severity,
              evaluation: rule.definition.evaluation,
              status,
              platform: context.platform,
              message,
              evidence,
            };
          }
          """
          )

          baseline = {
              'schemaVersion': 1,
              'intentionalClonePairs': [
                  {
                      'paths': [
                          'scripts/checks/component-quality/cli.ts',
                          'scripts/checks/component-quality/completion-contract-cli.ts',
                      ],
                      'reason': 'Parallel component-quality CLIs intentionally keep command-specific argument and diagnostic contracts explicit; sharing the small parser would couple distinct command UX without removing domain logic.',
                  },
                  {
                      'paths': [
                          'scripts/component-production/cli.ts',
                          'scripts/component-production/validate-cli.ts',
                      ],
                      'reason': 'Production and validation CLIs deliberately keep their command-specific usage and error contracts explicit. The repeated --spec parsing is narrow CLI scaffolding rather than reusable product logic.',
                  },
                  {
                      'paths': [
                          'scripts/smoke/native.mjs',
                          'scripts/smoke/web.mjs',
                      ],
                      'reason': 'Web and native smoke scripts intentionally assert the same shared package exports as a parity contract while retaining runtime-specific component assertions.',
                  },
              ],
          }
          Path('scripts/source-hygiene-baseline.json').write_text(
              json.dumps(baseline, indent=2) + '\n'
          )

          checker = Path('scripts/check-source-hygiene.mjs')
          text = checker.read_text()
          marker = """const generatedPathPatterns = [
            /(?:^|\\/)generated(?:\\/|$)/,
            /(?:^|\\/)fixtures(?:\\/|$)/,
          ];
          """
          baseline_insertion = """
          const cloneBaselinePath = path.join(root, 'scripts/source-hygiene-baseline.json');
          const cloneBaseline = JSON.parse(fs.readFileSync(cloneBaselinePath, 'utf8'));

          if (
            cloneBaseline.schemaVersion !== 1 ||
            !Array.isArray(cloneBaseline.intentionalClonePairs)
          ) {
            throw new Error('Invalid source-hygiene baseline contract.');
          }

          const intentionalClonePairs = new Map(
            cloneBaseline.intentionalClonePairs.map((entry) => {
              if (
                !Array.isArray(entry.paths) ||
                entry.paths.length !== 2 ||
                entry.paths.some((entryPath) => typeof entryPath !== 'string') ||
                typeof entry.reason !== 'string' ||
                entry.reason.trim() === ''
              ) {
                throw new Error('Invalid intentional clone baseline entry.');
              }

              return [[...entry.paths].sort().join('::'), entry.reason];
            })
          );
          """
          if 'const cloneBaselinePath =' not in text:
              if marker not in text:
                  raise SystemExit('Baseline insertion marker missing')
              text = text.replace(marker, marker + baseline_insertion, 1)

          old_clone = """function cloneSeverity(fileA, fileB) {
            const a = normalizePath(fileA);
            const b = normalizePath(fileB);

            if (
          """
          new_clone = """function cloneSeverity(fileA, fileB) {
            const a = normalizePath(fileA);
            const b = normalizePath(fileB);

            if (intentionalClonePairs.has([a, b].sort().join('::'))) {
              return 'warning';
            }

            if (
          """
          if 'intentionalClonePairs.has([a, b].sort().join' not in text:
              if old_clone not in text:
                  raise SystemExit('cloneSeverity marker missing')
              text = text.replace(old_clone, new_clone, 1)

          old_reason = """        const severity = cloneSeverity(a.filePath, b.filePath);
                findings.push({
          """
          new_reason = """        const severity = cloneSeverity(a.filePath, b.filePath);
                const baselineReason = intentionalClonePairs.get(pair);
                findings.push({
          """
          if 'const baselineReason = intentionalClonePairs.get(pair);' not in text:
              if old_reason not in text:
                  raise SystemExit('clone finding marker missing')
              text = text.replace(old_reason, new_reason, 1)

          old_message = """          reason: severity === 'error'
                    ? `Material ${windowSize}-line structural clone also appears at ${normalizePath(b.filePath)}:${b.line}. Extract a clear shared abstraction or add a narrow documented classification if the duplication is intentionally declarative.`
                    : `Material ${windowSize}-line clone is in a classified test/story/cross-platform/generator-owned/declarative surface. Keep explicit unless a clearer shared abstraction exists.`,
          """
          new_message = """          reason: severity === 'error'
                    ? `Material ${windowSize}-line structural clone also appears at ${normalizePath(b.filePath)}:${b.line}. Extract a clear shared abstraction or add a narrow documented classification if the duplication is intentionally declarative.`
                    : baselineReason
                      ? `Material ${windowSize}-line clone is an explicit path-scoped baseline exception: ${baselineReason}`
                      : `Material ${windowSize}-line clone is in a classified test/story/cross-platform/generator-owned/declarative surface. Keep explicit unless a clearer shared abstraction exists.`,
          """
          if 'explicit path-scoped baseline exception' not in text:
              if old_message not in text:
                  raise SystemExit('clone reason marker missing')
              text = text.replace(old_message, new_message, 1)

          checker.write_text(text)

          Path('.github/workflows/source-health-branch-fix.yml').unlink()
          PY

      - name: Commit branch repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/source-health-branch-fix.yml packages/react/src scripts
          git diff --cached --check
          git commit -m "chore(source): complete hygiene baseline repairs"
          git push origin HEAD:chore/source-health-817
