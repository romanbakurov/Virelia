name: Token Types Generator Format Probe

on:
  push:
    branches:
      - fix/token-types-generator-format

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Guard current branch head
        shell: bash
        run: |
          git fetch origin fix/token-types-generator-format
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/fix/token-types-generator-format)"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Guard temporary branch scope
        shell: bash
        run: |
          git fetch origin main
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/token-types-generator-format-probe.yml \
            packages/tokens/scripts/generate-token-types.ts)"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"
      - name: Verify clean generated authority before build
        run: |
          pnpm --filter @vellira-ui/tokens generate:types:check
          pnpm exec prettier --check \
            packages/tokens/scripts/generate-token-types.ts \
            packages/tokens/src/generated/token-types.ts
      - name: Prove build does not rewrite tracked source
        shell: bash
        run: |
          before="$(git status --porcelain=v1)"
          pnpm --filter @vellira-ui/tokens build
          after="$(git status --porcelain=v1)"
          printf '%s\n' "$after"
          test "$after" = "$before"
      - name: Verify generated output after build
        run: |
          pnpm --filter @vellira-ui/tokens generate:types:check
          pnpm exec prettier --check \
            packages/tokens/scripts/generate-token-types.ts \
            packages/tokens/src/generated/token-types.ts
          pnpm --filter @vellira-ui/tokens test
          pnpm --filter @vellira-ui/tokens typecheck
      - name: Diff safety
        run: git diff --check
      - name: Guard branch head after validation
        shell: bash
        run: |
          git fetch origin fix/token-types-generator-format
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/fix/token-types-generator-format)"
