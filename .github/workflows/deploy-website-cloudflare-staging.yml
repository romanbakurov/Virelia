name: Deploy Website Cloudflare Staging

on:
  push:
    branches:
      - feat/website-cloudflare-staging
    paths:
      - 'apps/website/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/deploy-website-cloudflare-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-cloudflare-staging-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.22.0
  STAGING_URL: https://vellira-website-staging.vellira.workers.dev

jobs:
  deploy:
    name: Build and deploy website staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website dependencies
        run: pnpm exec turbo run build --filter='@vellira-ui/website^...'

      - name: Sync website brand
        run: pnpm --dir apps/website run sync:brand

      - name: Build website for Cloudflare Workers
        run: pnpm --dir apps/website run build:opennext

      - name: Deploy website staging to Cloudflare Workers
        run: pnpm --dir apps/website run deploy:opennext
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke test deployed website
        shell: bash
        run: |
          set -euo pipefail

          sleep 15

          check_route() {
            local path="$1"
            shift
            local body
            local status
            local expected
            local matches
            body="$(mktemp)"

            for attempt in 1 2 3 4 5; do
              status="$(curl --location --silent --show-error \
                --header 'Cache-Control: no-cache' \
                --output "$body" --write-out '%{http_code}' \
                "$STAGING_URL$path" || true)"

              matches=true
              if [[ "$status" == "200" ]]; then
                for expected in "$@"; do
                  if ! grep --fixed-strings --quiet "$expected" "$body"; then
                    matches=false
                    break
                  fi
                done
              else
                matches=false
              fi

              if [[ "$matches" == "true" ]]; then
                echo "OK $path"
                rm -f "$body"
                return 0
              fi

              echo "Attempt $attempt failed for $path: HTTP $status"
              sleep 2
            done

            echo "Smoke test failed for $path"
            sed -n '1,40p' "$body"
            rm -f "$body"
            return 1
          }

          check_route '/' 'Vellira'
          check_route '/components/switch' 'Switch component for Vellira applications.'
          check_route '/blog' 'Practical engineering notes on design systems'
          check_route '/blog/two-runtimes' \
            'One Design System, Two Runtimes' \
            'data-language="ts"'
          check_route '/blog/rss.xml' '<rss version="2.0"'
          check_route '/sitemap.xml' '<urlset'
          check_route '/robots.txt' 'User-Agent: *'

      - name: Install Chromium for navigation smoke test
        run: pnpm --filter @vellira-ui/react-storybook run playwright:install

      - name: Smoke test client-side navigation and blog metrics
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @vellira-ui/react-storybook exec node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';

          const baseUrl = process.env.STAGING_URL;
          const metricsApiBaseUrl = 'https://api.vellira.dev';
          const browser = await chromium.launch();
          const page = await browser.newPage();
          const diagnostics = [];
          const criticalDiagnostics = [];
          const vercelRuntimeRequests = [];

          page.on('request', (request) => {
            if (request.url().startsWith(`${baseUrl}/_vercel/`)) {
              const diagnostic = `obsolete Vercel runtime request: ${request.url()}`;
              diagnostics.push(diagnostic);
              criticalDiagnostics.push(diagnostic);
              vercelRuntimeRequests.push(request.url());
            }
          });
          page.on('console', (message) => {
            if (message.type() === 'error') {
              diagnostics.push(`console.error: ${message.text()}`);
            }
          });
          page.on('pageerror', (error) => {
            const diagnostic = `pageerror: ${error.stack ?? error.message}`;
            diagnostics.push(diagnostic);
            criticalDiagnostics.push(diagnostic);
          });
          page.on('response', (response) => {
            const sameOrigin = response.url().startsWith(baseUrl);
            const metricsApi = response.url().startsWith(metricsApiBaseUrl);
            if ((sameOrigin || metricsApi) && response.status() >= 400) {
              const diagnostic =
                `response: ${response.status()} ${response.request().method()} ${response.url()}`;
              diagnostics.push(diagnostic);
              if (response.status() >= 500 || metricsApi) {
                criticalDiagnostics.push(diagnostic);
              }
            }
          });
          page.on('requestfailed', (request) => {
            if (
              request.url().startsWith(baseUrl) ||
              request.url().startsWith(metricsApiBaseUrl)
            ) {
              diagnostics.push(
                `requestfailed: ${request.method()} ${request.url()} ${request.failure()?.errorText ?? ''}`
              );
            }
          });

          async function loadHomePage() {
            await page.goto(baseUrl, {
              waitUntil: 'domcontentloaded',
              timeout: 30_000,
            });
            await page.locator('main').first().waitFor({
              state: 'visible',
              timeout: 15_000,
            });
            console.log('OK browser load /');
          }

          async function navigateByLink(startPath, href, expectedText) {
            await page.goto(`${baseUrl}${startPath}`, {
              waitUntil: 'domcontentloaded',
              timeout: 30_000,
            });
            const link = page.locator(`a[href="${href}"]`).first();
            await link.waitFor({ state: 'visible', timeout: 15_000 });
            await link.click();
            await page.waitForURL(`${baseUrl}${href}`, { timeout: 15_000 });
            await page.getByText(expectedText, { exact: false }).first().waitFor({
              state: 'visible',
              timeout: 15_000,
            });
            console.log(`OK client navigation ${startPath} -> ${href}`);
          }

          async function verifyHighlightedArticleCode() {
            await page.goto(`${baseUrl}/blog/two-runtimes`, {
              waitUntil: 'domcontentloaded',
              timeout: 30_000,
            });
            await page.locator('[data-language="ts"]').first().waitFor({
              state: 'visible',
              timeout: 15_000,
            });
            console.log('OK highlighted MDX code /blog/two-runtimes');
          }

          async function verifyBlogMetricsAndLikeMutation() {
            const slug = 'two-runtimes';
            const articlePath = `/blog/${slug}`;
            const likeUrl = `${metricsApiBaseUrl}/v1/blog/articles/${slug}/like`;
            const viewUrl = `${metricsApiBaseUrl}/v1/blog/articles/${slug}/views`;

            const likeStatePromise = page.waitForResponse(
              (response) =>
                response.url() === likeUrl && response.request().method() === 'GET',
              { timeout: 15_000 }
            );
            const viewPromise = page.waitForResponse(
              (response) =>
                response.url() === viewUrl && response.request().method() === 'POST',
              { timeout: 15_000 }
            );

            await page.goto(`${baseUrl}${articlePath}`, {
              waitUntil: 'domcontentloaded',
              timeout: 30_000,
            });

            const [likeStateResponse, viewResponse] = await Promise.all([
              likeStatePromise,
              viewPromise,
            ]);
            if (!likeStateResponse.ok() || !viewResponse.ok()) {
              throw new Error(
                `Blog metrics bootstrap failed: like=${likeStateResponse.status()} view=${viewResponse.status()}`
              );
            }

            const likeState = await likeStateResponse.json();
            const viewWrite = await viewResponse.json();
            if (typeof likeState?.liked !== 'boolean' || !viewWrite?.metrics) {
              throw new Error('Blog metrics bootstrap returned an invalid payload');
            }

            const formatCount = (value) => new Intl.NumberFormat('en-US').format(value);
            const expectedViews = `${formatCount(viewWrite.metrics.views)} views`;
            const expectedLikes = `${formatCount(viewWrite.metrics.likes)} likes`;

            await page.getByLabel(expectedViews).waitFor({
              state: 'visible',
              timeout: 15_000,
            });
            await page.getByLabel(expectedLikes).waitFor({
              state: 'visible',
              timeout: 15_000,
            });

            const initialLiked = likeState.liked;
            const initialLabel = initialLiked
              ? 'Unlike this article'
              : 'Like this article';
            const toggledLabel = initialLiked
              ? 'Like this article'
              : 'Unlike this article';
            const toggleMethod = initialLiked ? 'DELETE' : 'PUT';
            const restoreMethod = initialLiked ? 'PUT' : 'DELETE';

            await page.getByRole('button', { name: initialLabel }).waitFor({
              state: 'visible',
              timeout: 15_000,
            });

            const toggleResponsePromise = page.waitForResponse(
              (response) =>
                response.url() === likeUrl &&
                response.request().method() === toggleMethod,
              { timeout: 15_000 }
            );
            await page.getByRole('button', { name: initialLabel }).click();
            const toggleResponse = await toggleResponsePromise;
            if (!toggleResponse.ok()) {
              throw new Error(`Blog like toggle failed with ${toggleResponse.status()}`);
            }
            await page.getByRole('button', { name: toggledLabel }).waitFor({
              state: 'visible',
              timeout: 15_000,
            });

            const restoreResponsePromise = page.waitForResponse(
              (response) =>
                response.url() === likeUrl &&
                response.request().method() === restoreMethod,
              { timeout: 15_000 }
            );
            await page.getByRole('button', { name: toggledLabel }).click();
            const restoreResponse = await restoreResponsePromise;
            if (!restoreResponse.ok()) {
              throw new Error(`Blog like restore failed with ${restoreResponse.status()}`);
            }
            await page.getByRole('button', { name: initialLabel }).waitFor({
              state: 'visible',
              timeout: 15_000,
            });
            await page.getByRole('button', { name: 'Share' }).waitFor({
              state: 'visible',
              timeout: 15_000,
            });

            console.log(
              `OK blog metrics/CORS: GET like, POST view, ${toggleMethod} toggle, ${restoreMethod} restore`
            );
          }

          async function verifyMetricsFailureDoesNotBreakArticleActions() {
            const fallbackPage = await browser.newPage();
            await fallbackPage.route(`${metricsApiBaseUrl}/**`, (route) => route.abort());

            await fallbackPage.goto(`${baseUrl}/blog/two-runtimes`, {
              waitUntil: 'domcontentloaded',
              timeout: 30_000,
            });
            await fallbackPage.getByRole('heading', {
              level: 1,
              name: 'One Design System, Two Runtimes',
            }).waitFor({ state: 'visible', timeout: 15_000 });
            await fallbackPage.getByRole('button', { name: 'Share' }).waitFor({
              state: 'visible',
              timeout: 15_000,
            });

            if ((await fallbackPage.getByLabel('0 views').count()) > 0) {
              throw new Error('Unavailable metrics were rendered as fake 0 views');
            }
            if ((await fallbackPage.getByLabel('0 likes').count()) > 0) {
              throw new Error('Unavailable metrics were rendered as fake 0 likes');
            }

            await fallbackPage.close();
            console.log('OK metrics failure keeps article/share usable without fake zero state');
          }

          async function navigateViaContinueReading() {
            const startPath = '/blog/two-runtimes';
            await page.goto(`${baseUrl}${startPath}`, {
              waitUntil: 'domcontentloaded',
              timeout: 30_000,
            });

            const section = page.locator(
              'section[aria-labelledby="blog-continue-reading-heading"]'
            );
            await section.waitFor({ state: 'visible', timeout: 15_000 });

            const link = section.locator('a[href^="/blog/"]').first();
            await link.waitFor({ state: 'visible', timeout: 15_000 });

            const href = await link.getAttribute('href');
            const expectedTitle = (await link.locator('h3').innerText()).trim();
            if (!href || href === startPath || !expectedTitle) {
              throw new Error(
                `Invalid Continue reading target: href=${href} title=${expectedTitle}`
              );
            }

            await link.click();
            await page.waitForURL(`${baseUrl}${href}`, { timeout: 15_000 });
            await page.getByRole('heading', { level: 1, name: expectedTitle }).waitFor({
              state: 'visible',
              timeout: 15_000,
            });

            console.log(`OK Continue reading navigation ${startPath} -> ${href}`);
          }

          async function navigateWithinComponentSidebar() {
            await page.setViewportSize({ width: 1280, height: 900 });
            await page.goto(`${baseUrl}/components/switch`, {
              waitUntil: 'domcontentloaded',
              timeout: 30_000,
            });

            const sidebar = page.locator('aside[aria-label="Component navigation"]').first();
            await sidebar.waitFor({ state: 'visible', timeout: 15_000 });

            const checkboxLink = sidebar.locator('a[href="/components/checkbox"]');
            await checkboxLink.waitFor({ state: 'visible', timeout: 15_000 });
            await checkboxLink.click();
            await page.waitForURL(`${baseUrl}/components/checkbox`, { timeout: 15_000 });
            await page.getByRole('heading', { level: 1, name: 'Checkbox' }).waitFor({
              state: 'visible',
              timeout: 15_000,
            });

            console.log('OK desktop component sidebar navigation /components/switch -> /components/checkbox');
          }

          async function navigateWithinMobileComponentSidebar() {
            await page.setViewportSize({ width: 670, height: 900 });
            await page.goto(`${baseUrl}/components/switch`, {
              waitUntil: 'domcontentloaded',
              timeout: 30_000,
            });

            const trigger = page.getByRole('button', { name: 'Open component navigation' });
            await trigger.waitFor({ state: 'visible', timeout: 15_000 });
            await trigger.click();

            const mobileSidebar = page.locator('#component-navigation');
            await mobileSidebar.waitFor({ state: 'visible', timeout: 15_000 });

            const checkboxLink = mobileSidebar.locator('a[href="/components/checkbox"]');
            await checkboxLink.waitFor({ state: 'visible', timeout: 15_000 });
            await checkboxLink.click();
            await page.waitForURL(`${baseUrl}/components/checkbox`, { timeout: 15_000 });
            await page.getByRole('heading', { level: 1, name: 'Checkbox' }).waitFor({
              state: 'visible',
              timeout: 15_000,
            });
            await mobileSidebar.waitFor({ state: 'hidden', timeout: 15_000 });

            console.log('OK mobile component sidebar navigation /components/switch -> /components/checkbox and overlay closed');
          }

          try {
            await page.setViewportSize({ width: 1280, height: 900 });
            await loadHomePage();
            await navigateByLink(
              '/blog',
              '/blog/two-runtimes',
              'One Design System, Two Runtimes'
            );
            await verifyHighlightedArticleCode();
            await verifyBlogMetricsAndLikeMutation();
            await verifyMetricsFailureDoesNotBreakArticleActions();
            await navigateByLink(
              '/blog',
              '/blog/component-metadata-source-of-truth',
              'Component Metadata as a Source of Truth for a Design System'
            );
            await navigateByLink(
              '/blog',
              '/blog/controlled-uncontrolled-react-native',
              'Controlled and Uncontrolled State Across React and React Native'
            );
            await navigateViaContinueReading();
            await navigateByLink(
              '/components',
              '/components/switch',
              'Switch component for Vellira applications.'
            );
            await navigateWithinComponentSidebar();
            await navigateWithinMobileComponentSidebar();

            if (vercelRuntimeRequests.length > 0) {
              throw new Error(
                `Cloudflare staging emitted obsolete Vercel requests:\n${vercelRuntimeRequests.join('\n')}`
              );
            }
            if (criticalDiagnostics.length > 0) {
              throw new Error(
                `Critical browser diagnostics detected:\n${criticalDiagnostics.join('\n')}`
              );
            }
          } catch (error) {
            console.error(`Navigation smoke failed at ${page.url()}`);
            console.error(error);
            for (const diagnostic of diagnostics) {
              console.error(diagnostic);
            }
            await browser.close();
            process.exit(1);
          }

          for (const diagnostic of diagnostics) {
            console.log(diagnostic);
          }
          await browser.close();
          NODE
