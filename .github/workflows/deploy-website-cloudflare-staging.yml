name: Deploy Website Cloudflare Staging

on:
  push:
    branches:
      - feat/website-cloudflare-staging
    paths:
      - 'apps/website/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/deploy-website-cloudflare-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-cloudflare-staging-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.22.0

jobs:
  deploy:
    name: Build and deploy website staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website dependencies
        run: pnpm exec turbo run build --filter='@vellira-ui/website^...'

      - name: Sync website brand
        run: pnpm --dir apps/website run sync:brand

      - name: Build website for Cloudflare Workers
        run: pnpm --dir apps/website run build:vinext

      - name: Deploy website staging to Cloudflare Workers
        run: pnpm --dir apps/website run deploy:vinext
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
