name: Token Preservation Format Bootstrap

on:
  pull_request:
    paths:
      - 'packages/tokens/src/preservation/token-migrations.ts'
      - '.github/workflows/token-preservation-format-bootstrap.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: test/token-preservation-v1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prettier packages/tokens/src/preservation/token-migrations.ts --write
      - name: Commit exact format and remove bootstrap workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/tokens/src/preservation/token-migrations.ts
          git rm .github/workflows/token-preservation-format-bootstrap.yml
          git commit -m 'style(tokens): format preservation migration contract'
          git push origin HEAD:test/token-preservation-v1
