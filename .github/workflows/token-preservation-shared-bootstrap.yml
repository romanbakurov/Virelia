name: Token Preservation Shared Bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/token-preservation-shared-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cover public visual tokens outside theme objects
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/tokens/scripts/token-preservation.ts')
          source = path.read_text()
          source = source.replace(
              "} from '../src/preservation/token-migrations.js';\n\nimport { collectResolvedWebCssOutput }",
              "} from '../src/preservation/token-migrations.js';\nimport { overlay as primitiveOverlay } from '../src/primitives/overlay.js';\nimport { controlSizes } from '../src/tokens/controlSizes.js';\n\nimport { collectResolvedWebCssOutput }",
          )
          source = source.replace(
              "  collectLeafHashes(theme.tokens, 'tokens', result);\n\n  return result;",
              "  collectLeafHashes(theme.tokens, 'tokens', result);\n  collectLeafHashes(primitiveOverlay, 'primitives.overlay', result);\n  collectLeafHashes(controlSizes, 'tokens.controlSizes', result);\n\n  return result;",
          )
          path.write_text(source)
          PY
          pnpm prettier packages/tokens/scripts/token-preservation.ts --write
      - name: Regenerate preservation baseline
        run: pnpm --filter @vellira-ui/tokens preservation:baseline
      - name: Commit exact output and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/tokens/scripts/token-preservation.ts \
            packages/tokens/src/preservation/token-preservation-baseline.v1.json
          git rm .github/workflows/token-preservation-shared-bootstrap.yml
          git commit -m "test(tokens): preserve shared public visual tokens"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
