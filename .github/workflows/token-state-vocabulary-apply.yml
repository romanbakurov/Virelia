name: Token State Vocabulary Apply

on:
  push:
    branches:
      - refactor/token-state-vocabulary-v1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/token-state-vocabulary-v1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply state vocabulary migration
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';

          function read(path) {
            return fs.readFileSync(path, 'utf8');
          }

          function write(path, source) {
            fs.writeFileSync(path, source, 'utf8');
          }

          function replaceOrFail(source, from, to, label) {
            if (!source.includes(from)) {
              throw new Error(`Missing expected source for ${label}: ${from}`);
            }
            return source.replace(from, to);
          }

          const themes = ['light', 'dark', 'highContrast'];

          for (const theme of themes) {
            const controlPath = `packages/tokens/src/${theme}/semantic/control.ts`;
            let control = read(controlPath);
            control = replaceOrFail(
              control,
              '\n  active: {',
              '\n  pressed: {',
              `${theme} control active`
            );
            control = replaceOrFail(
              control,
              '\n    active: {',
              '\n    pressed: {',
              `${theme} selected control active`
            );
            write(controlPath, control);

            const actionPath = `packages/tokens/src/${theme}/semantic/action.ts`;
            let action = read(actionPath);
            const actionMatches = action.match(/\n    active: \{/g) ?? [];
            if (actionMatches.length !== 4) {
              throw new Error(`${theme} action expected 4 active states, found ${actionMatches.length}`);
            }
            action = action.replaceAll('\n    active: {', '\n    pressed: {');
            write(actionPath, action);

            const textPath = `packages/tokens/src/${theme}/semantic/text.ts`;
            let text = read(textPath);
            text = replaceOrFail(
              text,
              'interactiveActive:',
              'interactivePressed:',
              `${theme} interactive text state`
            );
            write(textPath, text);

            const radioPath = `packages/tokens/src/${theme}/components/radio.ts`;
            let radio = read(radioPath);
            radio = replaceOrFail(
              radio,
              'pressed: control.active',
              'pressed: control.pressed',
              `${theme} Radio pressed mapping`
            );
            write(radioPath, radio);

            for (const component of ['input', 'select']) {
              const componentPath = `packages/tokens/src/${theme}/components/${component}.ts`;
              let source = read(componentPath);
              source = replaceOrFail(
                source,
                'pressedBg: surface.active',
                'pressedBg: surface.pressed',
                `${theme} ${component} clear button pressed mapping`
              );
              write(componentPath, source);
            }
          }

          const switchPath = 'packages/tokens/src/factories/createSwitchTokens.ts';
          let switchSource = read(switchPath);
          switchSource = replaceOrFail(
            switchSource,
            '      active: SwitchSemanticState;',
            '      pressed: SwitchSemanticState;',
            'Switch selected semantic type'
          );
          switchSource = switchSource.replaceAll(
            'control.selected.active.',
            'control.selected.pressed.'
          );
          write(switchPath, switchSource);

          const radioFactoryPath = 'packages/tokens/src/factories/createRadioPalette.ts';
          let radioFactory = read(radioFactoryPath);
          radioFactory = replaceOrFail(
            radioFactory,
            '  pressedScale: 0.96,\n  activeScale: 0.92,',
            '  pressedScale: 0.92,',
            'Radio press motion ownership'
          );
          write(radioFactoryPath, radioFactory);

          const radioStylesPath = 'packages/react/src/primitives/Radio/Radio.module.scss';
          let radioStyles = read(radioStylesPath);
          radioStyles = replaceOrFail(
            radioStyles,
            'var(--radio-motion-active-scale)',
            'var(--radio-motion-pressed-scale)',
            'Radio pressed scale consumer'
          );
          write(radioStylesPath, radioStyles);

          const valueKindTestPath = 'packages/tokens/src/token-value-kinds.test.ts';
          let valueKindTest = read(valueKindTestPath);
          valueKindTest = replaceOrFail(
            valueKindTest,
            "requireTokenValueKind('components.radio.motion.activeScale', 0.92)",
            "requireTokenValueKind('components.radio.motion.pressedScale', 0.92)",
            'Radio value-kind representative path'
          );
          write(valueKindTestPath, valueKindTest);

          const generatorPath = 'scripts/generators/component/templates/component-tokens.ts';
          let generator = read(generatorPath);
          generator = replaceOrFail(
            generator,
            '      active: ${componentName}SemanticState;',
            '      pressed: ${componentName}SemanticState;',
            'Generator selected semantic type'
          );
          generator = generator.replaceAll(
            'control.selected.active.',
            'control.selected.pressed.'
          );
          generator = replaceOrFail(
            generator,
            'pressed: control.active,',
            'pressed: control.pressed,',
            'Generator generic pressed mapping'
          );
          write(generatorPath, generator);

          const generatorTestPath = 'scripts/generators/component/templates/component-tokens.test.ts';
          let generatorTest = read(generatorTestPath);
          generatorTest = generatorTest.replaceAll(
            'control.selected.active.bg',
            'control.selected.pressed.bg'
          );
          generatorTest = replaceOrFail(
            generatorTest,
            "expect(theme).toContain('pressed: control.active');",
            "expect(theme).toContain('pressed: control.pressed');\n    expect(theme).not.toContain('pressed: control.active');",
            'Generator generic pressed regression'
          );
          write(generatorTestPath, generatorTest);

          const architecturePath = 'packages/tokens/src/token-architecture.ts';
          let architecture = read(architecturePath);
          const authorityMarker = 'export const canonicalTokenVocabulary = {';
          const authorityBlock = `export const canonicalInteractionStates = [
            'default',
            'hover',
            'pressed',
            'active',
            'selected',
            'disabled',
            'focus',
          ] as const;

          export type CanonicalInteractionState =
            (typeof canonicalInteractionStates)[number];

          /**
           * Interaction-state semantics consumed by token audits, Generator V2, and agents.
           * State names describe meaning, never a visual intensity level.
           */
          export const interactionStateVocabularyV1 = {
            default: {
              temporality: 'resting',
              meaning: 'Resting enabled state before interaction or persistent selection.',
            },
            hover: {
              temporality: 'transient',
              meaning: 'Pointer hover only; optional when the input platform has no hover capability.',
            },
            pressed: {
              temporality: 'transient',
              meaning: 'Physical pointer or key activation while the interaction is held.',
            },
            active: {
              temporality: 'persistent-or-current',
              meaning: 'Current or persistently active domain state; never an alias for physical press.',
            },
            selected: {
              temporality: 'persistent',
              meaning: 'Chosen, checked, or selected domain state.',
            },
            disabled: {
              temporality: 'persistent',
              meaning: 'Unavailable interaction state that cannot be activated.',
            },
            focus: {
              temporality: 'transient-or-current',
              meaning: 'Current input focus indication, independent from hover, press, or selection.',
            },
          } as const;

          /**
           * Domains where active is intentionally distinct from physical press.
           * Patterns are architecture metadata for #890; they are not runtime selectors.
           */
          export const legitimatePersistentActiveStateDomainsV1 = [
            {
              pattern: 'semantic.surface.active',
              meaning: 'Generic current/active surface role distinct from surface.pressed.',
            },
            {
              pattern: 'semantic.menu.item.active',
              meaning: 'Current/highlighted menu item independent from physical press.',
            },
            {
              pattern: 'semantic.menu.item.danger.active',
              meaning: 'Current/highlighted danger menu item.',
            },
            {
              pattern: 'semantic.navigation.active',
              meaning: 'Current navigation destination.',
            },
            {
              pattern: 'semantic.navigation.optionActive',
              meaning: 'Current/highlighted navigation option.',
            },
            {
              pattern: 'components.contextMenu.item.active',
              meaning: 'Current/highlighted context-menu item.',
            },
            {
              pattern: 'components.dropdown.*.item.active',
              meaning: 'Current/highlighted dropdown item independent from :active press.',
            },
            {
              pattern: 'components.select.*.option.active',
              meaning: 'Current/highlighted Select option independent from aria-selected and press.',
            },
            {
              pattern: 'components.tabs.*.*.active',
              meaning: 'Current active tab presentation; physical press is a separate interaction.',
            },
          ] as const;

          `;
          architecture = replaceOrFail(
            architecture,
            authorityMarker,
            `${authorityBlock}${authorityMarker}`,
            'interaction state authority insertion'
          );
          architecture = replaceOrFail(
            architecture,
            "    'hover',\n    'active',\n    'pressed',",
            "    'hover',\n    'pressed',\n    'active',",
            'canonical state ordering'
          );
          architecture = architecture.replaceAll(
            'interactiveActive',
            'interactivePressed'
          );
          write(architecturePath, architecture);

          const migrationsPath = 'packages/tokens/src/preservation/token-migrations.ts';
          let migrations = read(migrationsPath);

          for (const id of [
            '881-radio-pressed-scale-web',
            '881-radio-active-scale-web',
          ]) {
            const pattern = new RegExp(
              `  \\{\\n    id: '${id}',[\\s\\S]*?\\n  \\},\\n`,
              'm'
            );
            if (!pattern.test(migrations)) {
              throw new Error(`Missing migration ${id}`);
            }
            migrations = migrations.replace(pattern, '');
          }

          const renamePairs = [];
          const stateGroups = [
            ['control-active', 'semantic.control.active', 'semantic.control.pressed'],
            [
              'control-selected-active',
              'semantic.control.selected.active',
              'semantic.control.selected.pressed',
            ],
            ['action-primary-active', 'semantic.action.primary.active', 'semantic.action.primary.pressed'],
            ['action-secondary-active', 'semantic.action.secondary.active', 'semantic.action.secondary.pressed'],
            ['action-close-active', 'semantic.action.close.active', 'semantic.action.close.pressed'],
            ['action-danger-active', 'semantic.action.danger.active', 'semantic.action.danger.pressed'],
          ];
          for (const [id, fromBase, toBase] of stateGroups) {
            for (const leaf of ['bg', 'fg', 'border']) {
              renamePairs.push({
                id: `${id}-${leaf}`,
                from: `${fromBase}.${leaf}`,
                to: `${toBase}.${leaf}`,
              });
            }
          }
          renamePairs.push({
            id: 'text-interactive-active',
            from: 'semantic.text.interactiveActive',
            to: 'semantic.text.interactivePressed',
          });

          const stateRenameEntries = renamePairs
            .flatMap(({ id, from, to }) => [
              `  {
                id: '882-${id}-rename',
                kind: 'rename',
                issue: '#882',
                reason: 'Rename a transient physical-interaction role to canonical pressed while preserving its resolved design value.',
                platforms: ['react-native'],
                from: '${from}',
                to: '${to}',
              },`,
              `  {
                id: '882-${id}-web-identity',
                kind: 'representation-change',
                layer: 'platform-output',
                issue: '#882',
                reason: 'Align the public Web CSS variable identity with the canonical pressed state name.',
                platforms: ['web'],
                from: '${from}',
                to: '${to}',
                equivalence: 'The paired canonical #882 rename preserves the resolved design value; only the Web CSS variable identity changes from active to pressed.',
                evidence: 'Token preservation validates the canonical/RN value-preserving rename; generated CSS checks and pinned Linux visual regression validate Web output.',
              },`,
            ])
            .join('\n');

          const stateVisualApproval =
            '#879/#882 explicitly authorizes removal of pressed/active semantic conflation; the change stays inside the existing Vellira palette and requires pinned Linux visual regression.';

          const stateSpecificEntries = `  {
            id: '882-radio-active-scale-remove',
            kind: 'remove',
            issue: '#882',
            reason: 'Remove activeScale because it encoded transient physical press rather than a persistent active state.',
            from: 'components.radio.motion.activeScale',
          },
          {
            id: '882-radio-pressed-scale-own-effective-press',
            kind: 'visual-change',
            issue: '#882',
            reason: 'Move the existing effective Radio press scale of 0.92 from misleading activeScale ownership to the canonical pressedScale token.',
            from: 'components.radio.motion.pressedScale',
            approved: true,
            approvalEvidence: '${stateVisualApproval}',
          },
          {
            id: '882-input-clear-button-pressed-surface',
            kind: 'visual-change',
            issue: '#882',
            reason: 'Map Input clear-button physical press to surface.pressed instead of the persistent/current surface.active role.',
            from: 'components.input.clearButton.pressedBg',
            approved: true,
            approvalEvidence: '${stateVisualApproval}',
          },
          {
            id: '882-select-clear-button-pressed-surface',
            kind: 'visual-change',
            issue: '#882',
            reason: 'Map Select clear-button physical press to surface.pressed instead of the persistent/current surface.active role.',
            from: 'components.select.clearButton.pressedBg',
            approved: true,
            approvalEvidence: '${stateVisualApproval}',
          },`;

          const manifestMarker = 'export const tokenMigrationManifestV1 = [\n';
          migrations = replaceOrFail(
            migrations,
            manifestMarker,
            `${manifestMarker}${stateRenameEntries}\n${stateSpecificEntries}\n`,
            'state vocabulary migration manifest insertion'
          );
          write(migrationsPath, migrations);
          EOF
      - name: Format migrated sources
        run: |
          git diff --name-only --diff-filter=ACM \
            | grep -E '\.(ts|tsx|scss|json|md|yml|yaml)$' \
            | xargs -r pnpm prettier --write
      - name: Regenerate token contracts
        run: |
          pnpm --filter @vellira-ui/tokens generate:types
          pnpm --filter @vellira-ui/tokens build:tokens
      - name: Validate token state migration
        run: |
          pnpm --filter @vellira-ui/tokens preservation:check
          pnpm --filter @vellira-ui/tokens test
          pnpm --filter @vellira-ui/tokens typecheck
          pnpm vitest run --config vitest.tooling.config.ts scripts/generators/component/templates/component-tokens.test.ts
      - name: Commit migrated state vocabulary and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/token-state-vocabulary-audit.yml
          git rm .github/workflows/token-state-vocabulary-apply.yml
          git add packages scripts
          git commit -m 'refactor(tokens): enforce canonical interaction states'
          git push origin HEAD:refactor/token-state-vocabulary-v1
