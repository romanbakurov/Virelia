name: UI Audit Docs 852 Probe

on:
  push:
    branches:
      - chore/ui-audit-docs-852

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exact docs theme findings
        shell: bash
        run: |
          pnpm exec tsx scripts/checks/vellira-ui-usage/cli.ts --json > /tmp/report.json
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/report.json', 'utf8'));
          const target = 'apps/docs/src/.vitepress/theme/styles.css';
          const findings = report.findings.filter((finding) => finding.path === target);
          console.log(JSON.stringify({ count: findings.length, findings }, null, 2));
          NODE
      - name: Relevant canonical CSS variables
        run: |
          pnpm exec tsx -e "import { canonicalCssVariableNames } from './scripts/design-resources/authority.ts'; const vars=[...(canonicalCssVariableNames(process.cwd()) ?? [])].filter((name)=>/--(?:surface|text|border|action|control|focus|status|space|font|radius|shadow|icon)/.test(name)).sort(); console.log(JSON.stringify(vars,null,2));"
