name: Source Hygiene Prettier Repair

on:
  push:
    branches:
      - chore/source-health-817

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/source-health-817

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format exact repair surface
        shell: bash
        run: |
          pnpm exec prettier --write \
            scripts/checks/component-quality/rules/api-feature.ts \
            scripts/checks/component-quality/rules/conformity.ts \
            scripts/checks/component-quality/rules/coverage.ts \
            scripts/checks/component-quality/rules/platform-accessibility.ts \
            scripts/source-hygiene-baseline.json
          rm .github/workflows/source-health-format-fix.yml

      - name: Commit formatting repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/source-health-format-fix.yml scripts/checks/component-quality/rules scripts/source-hygiene-baseline.json
          git diff --cached --check
          git diff --cached --exit-code --quiet && exit 0
          git commit -m "chore(source): apply prettier to hygiene repair"
          git push origin HEAD:chore/source-health-817
