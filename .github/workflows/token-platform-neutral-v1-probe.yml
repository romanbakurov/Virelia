name: Token Platform-Neutral V1 Probe

on:
  push:
    branches:
      - refactor/platform-neutral-component-tokens-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  structural-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/platform-neutral-component-tokens-v1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migration in workspace
        run: |
          python3 scripts/token-platform-neutral-v1-apply.py
          python3 scripts/token-platform-neutral-v1-test-fixup.py
          python3 scripts/token-platform-neutral-v1-boundary-fixup.py
          python3 scripts/token-platform-neutral-v1-rn-fixup.py
          python3 scripts/token-platform-neutral-v1-preservation-fixup.py

      - name: Format migration output
        run: |
          pnpm exec prettier --write \
            packages/tokens/src/platform-output \
            packages/tokens/src/factories \
            packages/tokens/src/light/components \
            packages/tokens/src/dark/components \
            packages/tokens/src/highContrast/components \
            packages/tokens/src/preservation/token-migrations.ts \
            packages/tokens/src/component-token-factories.test.ts \
            packages/tokens/src/component-token-platform-boundary.test.ts \
            packages/tokens/src/token-architecture.test.ts \
            packages/tokens/src/token-value-kinds.test.ts \
            packages/tokens/src/index.ts \
            packages/tokens/scripts/generate-token-types.ts \
            packages/tokens/scripts/token-css-output.ts \
            packages/tokens/scripts/token-preservation.ts \
            packages/react-native/src/theme \
            packages/react-native/src/components/Dropdown/Content/DropdownContent.styles.ts \
            packages/react-native/src/components/Select/Presentation/SelectPresentation.styles.ts \
            packages/react-native/src/components/Popover/Content/PopoverContent.styles.ts \
            packages/react-native/src/components/Tooltip/Tooltip.styles.ts \
            packages/react-native/src/components/Modal/Content/ModalContent.styles.ts \
            scripts/generators/component/platform-neutral-component-tokens.test.ts \
            docs/architecture/component-token-platform-boundary-v1.md

      - name: Diff safety
        run: git diff --check

      - name: Generate token outputs
        run: pnpm --filter @vellira-ui/tokens build:tokens

      - name: Token structural TypeScript
        run: |
          pnpm --filter @vellira-ui/tokens exec tsc -p tsconfig.json --noEmit
          pnpm --filter @vellira-ui/tokens exec tsc -p tsconfig.scripts.json --noEmit

      - name: Token tests without preservation precheck
        run: pnpm --filter @vellira-ui/tokens exec vitest run

      - name: Generator V2 boundary regression
        run: pnpm exec vitest run --config vitest.tooling.config.ts scripts/generators/component/platform-neutral-component-tokens.test.ts

      - name: React Native typecheck
        run: pnpm --filter @vellira-ui/react-native typecheck

      - name: Preservation check
        run: pnpm --filter @vellira-ui/tokens preservation:check

      - name: Materialize validated production diff
        run: |
          rm -f \
            .github/workflows/token-platform-neutral-v1-probe.yml \
            scripts/token-platform-neutral-v1-apply.py \
            scripts/token-platform-neutral-v1-test-fixup.py \
            scripts/token-platform-neutral-v1-boundary-fixup.py \
            scripts/token-platform-neutral-v1-rn-fixup.py \
            scripts/token-platform-neutral-v1-preservation-fixup.py

          test ! -e .github/workflows/token-platform-neutral-v1-probe.yml
          test ! -e scripts/token-platform-neutral-v1-apply.py
          test ! -e scripts/token-platform-neutral-v1-test-fixup.py
          test ! -e scripts/token-platform-neutral-v1-boundary-fixup.py
          test ! -e scripts/token-platform-neutral-v1-rn-fixup.py
          test ! -e scripts/token-platform-neutral-v1-preservation-fixup.py

          git diff --check
          echo '=== FINAL PRODUCTION DIFF ==='
          git status --short
          git diff --stat

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --cached --name-only | grep -E '(^|/)(token-platform-neutral-v1-(apply|test-fixup|boundary-fixup|rn-fixup|preservation-fixup)\.py|token-platform-neutral-v1-probe\.yml)$' >/dev/null; then
            echo 'Temporary probe scaffolding is still staged in final tree.' >&2
            exit 1
          fi

          git commit -m 'refactor(tokens): restore renderer-neutral component token boundary'
          git push origin HEAD:refactor/platform-neutral-component-tokens-v1
