name: Token Value Kind Finalize

on:
  push:
    branches:
      - fix/token-value-kinds-v1
    paths:
      - 'packages/tokens/**'
      - 'scripts/generators/component/**'
      - '.github/workflows/token-value-kind-finalize.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/token-value-kinds-v1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact Prettier output
        run: pnpm prettier packages/tokens/src/token-value-kinds.test.ts --write
      - name: Commit exact test formatting and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/tokens/src/token-value-kinds.test.ts
          git rm .github/workflows/token-value-kind-finalize.yml
          git commit -m 'test(tokens): format value-kind regressions'
          git push origin HEAD:fix/token-value-kinds-v1
      - name: Check changed-file formatting
        run: >-
          pnpm prettier
          packages/tokens/src/token-architecture.ts
          packages/tokens/scripts/token-css-output.ts
          packages/tokens/src/factories/createModalTokens.ts
          packages/tokens/src/preservation/token-migrations.ts
          packages/tokens/scripts/token-css-output.test.ts
          packages/tokens/src/token-value-kinds.test.ts
          packages/tokens/scripts/token-preservation-routing.test.ts
          packages/tokens/scripts/token-preservation.ts
          scripts/generators/component/token-value-kinds.ts
          scripts/generators/component/templates/component-tokens.ts
          scripts/generators/component/token-value-kinds.test.ts
          --check
      - name: Token package tests
        run: pnpm --filter @vellira-ui/tokens test
      - name: Token package typecheck
        run: pnpm --filter @vellira-ui/tokens typecheck
      - name: Tooling typecheck
        run: pnpm typecheck:tooling
      - name: Tooling tests
        run: pnpm test:tooling
