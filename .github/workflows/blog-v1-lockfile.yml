name: Blog V1 branch preparation

on:
  push:
    branches: [feat/blog-v1-content-foundation]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/blog-v1-content-foundation

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Refresh dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Format Blog V1 files
        run: >-
          pnpm exec prettier
          apps/website/package.json
          apps/website/next.config.ts
          apps/website/mdx-components.tsx
          apps/website/src/blog/types.ts
          apps/website/src/blog/schema.ts
          apps/website/src/blog/store.ts
          apps/website/src/blog/index.ts
          apps/website/content/blog/README.md
          scripts/blog/blog-content.test.ts
          --write

      - name: Commit generated lockfile and formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No preparation changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml \
            apps/website/package.json \
            apps/website/next.config.ts \
            apps/website/mdx-components.tsx \
            apps/website/src/blog/types.ts \
            apps/website/src/blog/schema.ts \
            apps/website/src/blog/store.ts \
            apps/website/src/blog/index.ts \
            apps/website/content/blog/README.md \
            scripts/blog/blog-content.test.ts
          git commit -m "chore(blog): prepare MDX dependencies"
          git push origin HEAD:feat/blog-v1-content-foundation
