name: PR 907 Tooling Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tooling-diagnostic:
    name: Tooling diagnostic
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture React resolution
        shell: bash
        run: |
          node <<'NODE' > react-resolution.log
          const fs = require('node:fs');
          const path = require('node:path');
          const { createRequire } = require('node:module');

          for (const base of ['.', 'apps/website', 'packages/react']) {
            const from = path.resolve(base, 'package.json');
            const localRequire = createRequire(from);
            console.log(`base=${base}`);
            for (const specifier of ['react', 'react-dom', '@testing-library/react']) {
              try {
                console.log(`  ${specifier} -> ${localRequire.resolve(specifier)}`);
              } catch (error) {
                console.log(`  ${specifier} -> UNRESOLVED (${error.code ?? error.message})`);
              }
            }
          }

          for (const candidate of [
            'node_modules/react/package.json',
            'node_modules/react-dom/package.json',
            'apps/website/node_modules/react/package.json',
            'apps/website/node_modules/react-dom/package.json',
            'packages/react/node_modules/react/package.json',
            'packages/react/node_modules/react-dom/package.json',
            'node_modules/@testing-library/react/node_modules/react-dom/package.json',
            'node_modules/@testing-library/react/node_modules/react/package.json',
          ]) {
            if (!fs.existsSync(candidate)) {
              console.log(`${candidate} -> MISSING`);
              continue;
            }
            const manifest = JSON.parse(fs.readFileSync(candidate, 'utf8'));
            console.log(`${candidate} -> ${manifest.version}`);
          }
          NODE
          cat react-resolution.log

      - name: Upload tooling diagnostic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr907-tooling-diagnostic
          path: react-resolution.log
          if-no-files-found: error
          retention-days: 1
