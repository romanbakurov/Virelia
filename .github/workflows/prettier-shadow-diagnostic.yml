name: Prettier Shadow Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prettier-shadow-diagnostic:
    name: Show canonical Prettier diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and show exact diff
        run: |
          pnpm exec prettier \
            packages/tokens/src/effects/shadow-system.ts \
            packages/tokens/src/effects/shadow-system.test.ts \
            --write
          git diff --exit-code -- \
            packages/tokens/src/effects/shadow-system.ts \
            packages/tokens/src/effects/shadow-system.test.ts
