name: Generate Switch Website Page

on:
  push:
    branches:
      - feat/switch-generator-v2-pilot

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Switch website page through canonical generator
        run: pnpm create:component-page Switch

      - name: Sync Switch public API contract
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';

          const file = 'scripts/check-public-api.mjs';
          let source = fs.readFileSync(file, 'utf8');

          const nativeMarker = "    'SelectVirtualConfig',\n    'Tabs',";
          if (!source.includes("    'Switch',\n    'SwitchProps',\n    'Tabs',")) {
            source = source.replace(
              nativeMarker,
              "    'SelectVirtualConfig',\n    'Switch',\n    'SwitchProps',\n    'Tabs',"
            );
          }

          const reactMarker = "    'SelectRenderValueContext',\n    'Tabs',";
          if (!source.includes("    'SelectRenderValueContext',\n    'Switch',\n    'SwitchProps',\n    'Tabs',")) {
            source = source.replace(
              reactMarker,
              "    'SelectRenderValueContext',\n    'Switch',\n    'SwitchProps',\n    'Tabs',"
            );
          }

          fs.writeFileSync(file, source);
          EOF

      - name: Commit generated updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/website scripts/check-public-api.mjs

          if git diff --cached --quiet; then
            echo "No generated updates to commit."
            exit 0
          fi

          git commit -m "fix(tooling): sync Switch generated contracts"
          git push
