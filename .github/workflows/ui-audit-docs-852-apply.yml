name: UI Audit Docs 852 Apply

on:
  push:
    branches:
      - chore/ui-audit-docs-852

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message != 'fix(docs): migrate theme visuals to canonical tokens' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Guard exact apply parent
        run: test "$(git rev-parse HEAD^)" = "deda55dba239e03f82e359a1942ca1b988086ecd"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply exact docs migration
        run: |
          python .github/probes/852/apply-docs-theme.py
          pnpm exec prettier --write \
            apps/docs/package.json \
            apps/docs/src/.vitepress/theme/index.ts \
            apps/docs/src/.vitepress/theme/styles.css
          CI=false pnpm install --lockfile-only
          pnpm install --frozen-lockfile

      - name: Guard exact production scope
        shell: bash
        run: |
          actual="$(git status --porcelain=v1 | sed -E 's/^.. //' | sort)"
          expected="$(printf '%s\n' \
            apps/docs/package.json \
            apps/docs/src/.vitepress/theme/index.ts \
            apps/docs/src/.vitepress/theme/styles.css \
            pnpm-lock.yaml | sort)"
          test "$actual" = "$expected"

      - name: Prove docs theme audit is clean
        shell: bash
        run: |
          pnpm check:vellira-ui-usage:json > /tmp/report.json
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/report.json', 'utf8'));
          const target = 'apps/docs/src/.vitepress/theme/styles.css';
          const findings = report.findings.filter((finding) => finding.path === target);
          console.log(JSON.stringify({ count: findings.length, findings }, null, 2));
          if (findings.length !== 0) process.exit(1);
          NODE
          node - <<'NODE'
          const fs = require('node:fs');
          const css = fs.readFileSync('apps/docs/src/.vitepress/theme/styles.css', 'utf8');
          const authoredRules = css.slice(css.indexOf('\nbody {'));
          const raw = authoredRules.match(/#[0-9a-fA-F]{3,8}\b|rgba?\([^)]*\)/g) ?? [];
          console.log(JSON.stringify({ rawVisualColorsAfterThemeBridge: raw }, null, 2));
          if (raw.length !== 0) process.exit(1);
          NODE

      - name: Validate docs integration
        run: |
          pnpm exec prettier --check \
            apps/docs/package.json \
            apps/docs/src/.vitepress/theme/index.ts \
            apps/docs/src/.vitepress/theme/styles.css
          pnpm --filter @vellira-ui/tokens build
          pnpm --filter @vellira-ui/docs typecheck
          pnpm --filter @vellira-ui/docs build
          git diff --check

      - name: Guard branch before push
        shell: bash
        run: |
          git fetch origin chore/ui-audit-docs-852
          test "$(git rev-parse origin/chore/ui-audit-docs-852)" = "$(git rev-parse HEAD)"

      - name: Commit and push migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/docs/package.json \
            apps/docs/src/.vitepress/theme/index.ts \
            apps/docs/src/.vitepress/theme/styles.css \
            pnpm-lock.yaml
          git diff --cached --check
          git commit -m "fix(docs): migrate theme visuals to canonical tokens"
          git push origin HEAD:chore/ui-audit-docs-852
