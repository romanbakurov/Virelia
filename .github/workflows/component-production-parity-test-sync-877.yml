name: Component Production Parity Test Sync 877

on:
  push:
    branches:
      - chore/component-production-probe-877

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout production contract branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/component-production-contract-877
          fetch-depth: 0
      - name: Guard expected head
        run: test "$(git rev-parse HEAD)" = "c242a55dd73e70a9b3467392fff865ddb85d82e7"
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Patch unit-test website contract boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/generators/component/run.test.ts')
          source = path.read_text()
          marker = """vi.mock('./website', () => ({
            generateComponentWebsitePage: vi.fn(),
          }));
          """
          addition = """
          vi.mock('./website-contract', async () => {
            const actual =
              await vi.importActual<typeof import('./website-contract')>('./website-contract');

            return {
              ...actual,
              checkComponentWebsiteContract: vi.fn(() => []),
            };
          });
          """
          if source.count(marker) != 1:
              raise SystemExit(f'expected website mock anchor exactly once, found {source.count(marker)}')
          path.write_text(source.replace(marker, marker + addition, 1))
          PY
      - name: Format parity slice
        run: pnpm exec prettier scripts/generators/component/run.ts scripts/generators/component/plan-contract.ts scripts/generators/component/website-contract.ts scripts/generators/component/run.test.ts --write
      - name: Check formatting
        run: pnpm exec prettier scripts/generators/component/run.ts scripts/generators/component/plan-contract.ts scripts/generators/component/website-contract.ts scripts/generators/component/run.test.ts --check
      - name: Tooling typecheck
        run: pnpm exec tsc -p tsconfig.tooling.json --noEmit
      - name: Run generator contract tests
        run: pnpm exec vitest run --config vitest.tooling.config.ts scripts/generators/component/run.test.ts
      - name: Diff safety
        run: git diff --check
      - name: Commit synchronized parity slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generators/component/run.ts scripts/generators/component/plan-contract.ts scripts/generators/component/website-contract.ts scripts/generators/component/run.test.ts
          git diff --cached --exit-code && exit 0
          git commit -m "test(generator): cover production contract parity boundary"
          git push origin HEAD:feat/component-production-contract-877
