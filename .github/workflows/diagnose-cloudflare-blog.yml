name: Diagnose Cloudflare Blog 503

on:
  push:
    branches:
      - feat/website-cloudflare-staging
    paths:
      - '.github/workflows/diagnose-cloudflare-blog.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  STAGING_URL: https://vellira-website-staging.vellira.workers.dev

jobs:
  diagnose:
    name: Verify cached article resource usage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture cached routes and Worker tail
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail

          tail_log="$(mktemp)"
          failures="$(mktemp)"

          cleanup() {
            rm -f "$tail_log" "$failures"
          }
          trap cleanup EXIT

          echo 'Starting Worker tail...'
          timeout 40s pnpm --dir apps/website exec wrangler tail \
            vellira-website-staging \
            --format json \
            --method GET \
            >"$tail_log" 2>&1 &
          tail_pid=$!

          sleep 5

          request_route() {
            local path="$1"
            local headers
            local body
            local status
            headers="$(mktemp)"
            body="$(mktemp)"

            status="$(curl --location --silent --show-error \
              --dump-header "$headers" \
              --output "$body" \
              --write-out '%{http_code}' \
              "$STAGING_URL$path" || true)"

            echo "HTTP $status $path"
            grep -Ei '^(x-nextjs-cache|x-nextjs-prerender|cache-control|cf-cache-status|server):' "$headers" || true

            if [[ "$status" != '200' ]]; then
              echo "$path -> HTTP $status" >>"$failures"
              sed -n '1,20p' "$body"
            fi

            rm -f "$headers" "$body"
          }

          echo '=== SEQUENTIAL CACHED ARTICLE REQUESTS ==='
          request_route '/blog/two-runtimes'
          request_route '/blog/component-metadata-source-of-truth'
          request_route '/blog/controlled-uncontrolled-react-native'
          request_route '/blog/controlled-uncontrolled-react-native'
          request_route '/components/switch'
          request_route '/components/checkbox'

          echo '=== MODEST CONCURRENT CACHED REQUEST BURST ==='
          routes=(
            '/blog/two-runtimes'
            '/blog/component-metadata-source-of-truth'
            '/blog/controlled-uncontrolled-react-native'
            '/blog/cross-platform-form-vellira'
            '/components/switch'
            '/components/checkbox'
          )
          pids=()
          for path in "${routes[@]}"; do
            request_route "$path" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "$pid" || true
          done

          sleep 5
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true

          echo '=== WORKER TAIL ==='
          cat "$tail_log"

          if [[ -s "$failures" ]]; then
            echo 'One or more cached route requests failed:'
            cat "$failures"
            exit 1
          fi

          if grep -q '1102' "$tail_log"; then
            echo 'Worker tail contained Error 1102.'
            exit 1
          fi

          echo 'All representative cached routes returned HTTP 200.'
