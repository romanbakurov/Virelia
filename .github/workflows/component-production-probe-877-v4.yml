name: Component Production Contract Probe 877 V4

on:
  push:
    branches:
      - chore/component-production-probe-877

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/component-production-contract-877
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply lifecycle patch
        run: |
          test "$(git rev-parse HEAD)" = "e3a72d56ec9749f22428dfcb09f6d064dec900c7"
          git fetch origin chore/component-production-probe-877
          git show origin/chore/component-production-probe-877:.github/probes/apply-877-lifecycle.py > /tmp/apply-877-lifecycle.py
          python /tmp/apply-877-lifecycle.py
          pnpm exec prettier \
            scripts/component-production/contracts.ts \
            scripts/component-production/run.ts \
            scripts/component-production/cli.ts \
            scripts/component-production/contracts.test.ts \
            scripts/component-production/run.test.ts \
            scripts/component-production/cli.test.ts \
            scripts/component-production/validate-cli.test.ts \
            scripts/generators/component/README.md \
            --write
          git diff --check
      - name: Build workspace
        run: pnpm ci:build
      - name: Typecheck tooling
        run: pnpm typecheck:tooling
      - name: Test lifecycle contract
        run: |
          pnpm exec vitest run --config vitest.tooling.config.ts \
            scripts/component-production/contracts.test.ts \
            scripts/component-production/run.test.ts \
            scripts/component-production/cli.test.ts \
            scripts/component-production/validate-cli.test.ts \
            scripts/component-production/generation.test.ts \
            scripts/generators/component/preflight.test.ts
      - name: Commit lifecycle slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/component-production/contracts.ts \
            scripts/component-production/run.ts \
            scripts/component-production/cli.ts \
            scripts/component-production/contracts.test.ts \
            scripts/component-production/run.test.ts \
            scripts/component-production/cli.test.ts \
            scripts/component-production/validate-cli.test.ts \
            scripts/generators/component/README.md
          git commit -m "feat(tooling): enforce component production lifecycle"
          git push origin HEAD:feat/component-production-contract-877
