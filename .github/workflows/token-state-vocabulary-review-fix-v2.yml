name: Token State Vocabulary Review Fix V2

on:
  push:
    branches:
      - refactor/token-state-vocabulary-v1

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/token-state-vocabulary-v1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply review cleanup
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';

          function replaceOrFail(source, from, to, label) {
            if (!source.includes(from)) {
              throw new Error(`Missing expected source for ${label}`);
            }
            return source.replace(from, to);
          }

          const architecturePath = 'packages/tokens/src/token-architecture.ts';
          let architecture = fs.readFileSync(architecturePath, 'utf8');
          architecture = replaceOrFail(
            architecture,
            `  surface: [
              'canvas',
              'default',
              'subtle',
              'muted',
              'elevated',
              'hover',
              'pressed',
              'active',`,
            `  surface: [
              'canvas',
              'default',
              'subtle',
              'muted',
              'elevated',
              'hover',
              'active',
              'pressed',`,
            'surface vocabulary order'
          );
          architecture = replaceOrFail(
            architecture,
            `  state: [
              'default',
              'hover',
              'active',
              'pressed',`,
            `  state: [
              'default',
              'hover',
              'pressed',
              'active',`,
            'interaction state vocabulary order'
          );
          fs.writeFileSync(architecturePath, architecture, 'utf8');

          const migrationsPath = 'packages/tokens/src/preservation/token-migrations.ts';
          let migrations = fs.readFileSync(migrationsPath, 'utf8');

          const renamePairs = [
            ['control-active-bg', 'semantic.control.active.bg', 'semantic.control.pressed.bg'],
            ['control-active-fg', 'semantic.control.active.fg', 'semantic.control.pressed.fg'],
            ['control-active-border', 'semantic.control.active.border', 'semantic.control.pressed.border'],
            ['control-selected-active-bg', 'semantic.control.selected.active.bg', 'semantic.control.selected.pressed.bg'],
            ['control-selected-active-fg', 'semantic.control.selected.active.fg', 'semantic.control.selected.pressed.fg'],
            ['control-selected-active-border', 'semantic.control.selected.active.border', 'semantic.control.selected.pressed.border'],
            ['action-primary-active-bg', 'semantic.action.primary.active.bg', 'semantic.action.primary.pressed.bg'],
            ['action-primary-active-fg', 'semantic.action.primary.active.fg', 'semantic.action.primary.pressed.fg'],
            ['action-primary-active-border', 'semantic.action.primary.active.border', 'semantic.action.primary.pressed.border'],
            ['action-secondary-active-bg', 'semantic.action.secondary.active.bg', 'semantic.action.secondary.pressed.bg'],
            ['action-secondary-active-fg', 'semantic.action.secondary.active.fg', 'semantic.action.secondary.pressed.fg'],
            ['action-secondary-active-border', 'semantic.action.secondary.active.border', 'semantic.action.secondary.pressed.border'],
            ['action-close-active-bg', 'semantic.action.close.active.bg', 'semantic.action.close.pressed.bg'],
            ['action-close-active-fg', 'semantic.action.close.active.fg', 'semantic.action.close.pressed.fg'],
            ['action-close-active-border', 'semantic.action.close.active.border', 'semantic.action.close.pressed.border'],
            ['action-danger-active-bg', 'semantic.action.danger.active.bg', 'semantic.action.danger.pressed.bg'],
            ['action-danger-active-fg', 'semantic.action.danger.active.fg', 'semantic.action.danger.pressed.fg'],
            ['action-danger-active-border', 'semantic.action.danger.active.border', 'semantic.action.danger.pressed.border'],
            ['text-interactive-active', 'semantic.text.interactiveActive', 'semantic.text.interactivePressed'],
          ];
          const pairSource = renamePairs
            .map(([id, from, to]) => `  ['${id}', '${from}', '${to}'],`)
            .join('\n');

          const helper = `const stateVocabularyVisualApproval =
            '#879/#882 explicitly authorizes removal of pressed/active semantic conflation; the change stays inside the existing Vellira palette and requires pinned Linux visual regression.';

          const stateVocabularyRenamePairsV1 = [
          ${pairSource}
          ] as const;

          const stateVocabularyRenameMigrationsV1 =
            stateVocabularyRenamePairsV1.flatMap(([id, from, to]) => [
              {
                id: \`882-\${id}-rename\`,
                kind: 'rename',
                issue: '#882',
                reason:
                  'Rename a transient physical-interaction role to canonical pressed while preserving its resolved design value.',
                platforms: ['react-native'],
                from,
                to,
              } as const,
              {
                id: \`882-\${id}-web-identity\`,
                kind: 'representation-change',
                layer: 'platform-output',
                issue: '#882',
                reason:
                  'Align the public Web CSS variable identity with the canonical pressed state name.',
                platforms: ['web'],
                from,
                to,
                equivalence:
                  'The paired canonical #882 rename preserves the resolved design value; only the Web CSS variable identity changes from active to pressed.',
                evidence:
                  'Token preservation validates the canonical/RN value-preserving rename; generated CSS checks and pinned Linux visual regression validate Web output.',
              } as const,
            ]) satisfies readonly TokenMigrationEntry[];

          `;

          const helperMarker = '/**\n * Migration/test metadata only. This is not a runtime token registry.';
          const helperIndex = migrations.indexOf(helperMarker);
          if (helperIndex < 0) {
            throw new Error('Unable to locate migration metadata comment');
          }
          migrations = migrations.slice(0, helperIndex) + helper + migrations.slice(helperIndex);

          const manifestStartText = 'export const tokenMigrationManifestV1 = [\n';
          const start = migrations.indexOf(manifestStartText);
          const tailIdIndex = migrations.indexOf("id: '881-modal-z-index-offset-number'", start);
          const tail = migrations.lastIndexOf('  {', tailIdIndex);
          if (start < 0 || tailIdIndex < 0 || tail < start) {
            throw new Error('Unable to locate state migration manifest block');
          }

          const compactStateBlock = `export const tokenMigrationManifestV1 = [
            ...stateVocabularyRenameMigrationsV1,
            {
              id: '882-radio-active-scale-remove',
              kind: 'remove',
              issue: '#882',
              reason:
                'Remove activeScale because it encoded transient physical press rather than a persistent active state.',
              from: 'components.radio.motion.activeScale',
            },
            {
              id: '882-radio-pressed-scale-own-effective-press',
              kind: 'visual-change',
              issue: '#882',
              reason:
                'Move the existing effective Radio press scale of 0.92 from misleading activeScale ownership to the canonical pressedScale token.',
              from: 'components.radio.motion.pressedScale',
              approved: true,
              approvalEvidence: stateVocabularyVisualApproval,
            },
            {
              id: '882-input-clear-button-pressed-surface',
              kind: 'visual-change',
              issue: '#882',
              reason:
                'Map Input clear-button physical press to surface.pressed instead of the persistent/current surface.active role.',
              from: 'components.input.clearButton.pressedBg',
              approved: true,
              approvalEvidence: stateVocabularyVisualApproval,
            },
            {
              id: '882-select-clear-button-pressed-surface',
              kind: 'visual-change',
              issue: '#882',
              reason:
                'Map Select clear-button physical press to surface.pressed instead of the persistent/current surface.active role.',
              from: 'components.select.clearButton.pressedBg',
              approved: true,
              approvalEvidence: stateVocabularyVisualApproval,
            },
          `;
          migrations = migrations.slice(0, start) + compactStateBlock + migrations.slice(tail);
          fs.writeFileSync(migrationsPath, migrations, 'utf8');
          EOF
      - name: Validate cleanup
        run: |
          pnpm prettier packages/tokens/src/token-architecture.ts packages/tokens/src/preservation/token-migrations.ts --write
          pnpm --filter @vellira-ui/tokens preservation:check
          pnpm --filter @vellira-ui/tokens test
          pnpm --filter @vellira-ui/tokens typecheck
      - name: Commit cleanup and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/token-state-vocabulary-review-fix.yml
          git rm .github/workflows/token-state-vocabulary-review-fix-v2.yml
          git add packages/tokens/src/token-architecture.ts packages/tokens/src/preservation/token-migrations.ts
          git commit -m 'refactor(tokens): compact state migration evidence'
          git push origin HEAD:refactor/token-state-vocabulary-v1
