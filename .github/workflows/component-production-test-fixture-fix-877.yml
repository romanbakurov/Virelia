name: Component Production Test Fixture Fix 877

on:
  push:
    branches:
      - chore/component-production-probe-877

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout production contract branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/component-production-contract-877
          fetch-depth: 0
      - name: Guard expected head
        run: |
          test "$(git rev-parse HEAD)" = "3f12f04cd43c83e7bc3d5c078ed4269b1f1a2157"
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Patch canonical shared-types test fixture
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/generators/component/run.test.ts')
          source = path.read_text()
          old = """  fs.mkdirSync(sharedTypesDir, { recursive: true });
          fs.writeFileSync(path.join(sharedTypesDir, 'index.ts'), '');

          const metadataDir = path.join(
          """
          new = """  fs.mkdirSync(sharedTypesDir, { recursive: true });
          fs.writeFileSync(path.join(sharedTypesDir, 'index.ts'), '');
          fs.writeFileSync(
            path.join(root, 'packages', 'types', 'package.json'),
            `${JSON.stringify({ name: '@vellira-ui/types' }, null, 2)}\\n`
          );

          const metadataDir = path.join(
          """
          if source.count(old) != 1:
              raise SystemExit(f'expected fixture anchor exactly once, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
      - name: Check formatting
        run: pnpm exec prettier scripts/generators/component/run.test.ts scripts/component-production/cli.integration.test.ts --check
      - name: Run failed tooling tests
        run: pnpm exec vitest run --config vitest.tooling.config.ts scripts/generators/component/run.test.ts scripts/component-production/cli.integration.test.ts
      - name: Diff safety
        run: git diff --check
      - name: Commit test fixture fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generators/component/run.test.ts
          git diff --cached --exit-code && exit 0
          git commit -m "test(generator): model canonical shared types package"
          git push origin HEAD:feat/component-production-contract-877
