name: Materialize shadow boundary formatting

on:
  push:
    branches: [refactor/unified-shadow-elevation-v1]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/unified-shadow-elevation-v1
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Materialize canonical Prettier output
        run: |
          pnpm exec prettier packages/tokens/src/effects/shadow-platform-boundary.test.ts --write
          echo '=== FORMATTED FILE START ==='
          cat packages/tokens/src/effects/shadow-platform-boundary.test.ts
          echo '=== FORMATTED FILE END ==='
          git fetch origin main
          git diff --check origin/main
