name: Component Production Readiness Slice 4 878

on:
  push:
    branches:
      - chore/component-production-readiness-probe-878

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/component-production-readiness-878
          fetch-depth: 0

      - name: Guard exact target head
        run: test "$(git rev-parse HEAD)" = "cf63482531d17e734f69268790a481964c5e3462"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply representative readiness fixture patch
        shell: bash
        run: |
          git fetch origin chore/component-production-readiness-probe-878
          git show FETCH_HEAD:.github/probes/878/apply-slice4.py > /tmp/apply-readiness-878-slice4.py
          python3 /tmp/apply-readiness-878-slice4.py

      - name: Format changed file
        run: pnpm exec prettier --write scripts/component-production/run.test.ts

      - name: Guard exact change scope
        shell: bash
        run: |
          actual="$(git status --porcelain=v1 | sed -E 's/^.. //' | sort)"
          expected="scripts/component-production/run.test.ts"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"

      - name: Targeted representative readiness regressions
        run: |
          pnpm exec vitest run --config vitest.tooling.config.ts \
            scripts/component-production/run.test.ts \
            scripts/component-production/command-validation.test.ts \
            scripts/component-production/structured-validation.test.ts \
            scripts/component-production/final-validation.test.ts

      - name: Source quality
        run: pnpm ci:quality

      - name: Workspace build
        run: pnpm ci:build

      - name: Tooling typecheck
        run: pnpm typecheck:tooling

      - name: Full tooling tests
        run: pnpm test:tooling

      - name: Guard build idempotency and exact scope
        shell: bash
        run: |
          actual="$(git status --porcelain=v1 | sed -E 's/^.. //' | sort)"
          expected="scripts/component-production/run.test.ts"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"

      - name: Diff safety
        run: git diff --check

      - name: Guard target head before push
        shell: bash
        run: |
          git fetch origin feat/component-production-readiness-878
          test "$(git rev-parse origin/feat/component-production-readiness-878)" = "cf63482531d17e734f69268790a481964c5e3462"

      - name: Commit and push slice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/component-production/run.test.ts
          git diff --cached --check
          git commit -m "test(tooling): prove representative production readiness"
          git push origin HEAD:feat/component-production-readiness-878
