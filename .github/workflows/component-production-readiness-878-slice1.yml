name: Component Production Readiness Slice 3 878

on:
  push:
    branches:
      - chore/component-production-readiness-probe-878

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/component-production-readiness-878
          fetch-depth: 0

      - name: Guard exact target head
        run: test "$(git rev-parse HEAD)" = "72699c0b611ef223ff86939ea80322e845aad9b3"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply production contract agreement patch
        shell: bash
        run: |
          git fetch origin chore/component-production-readiness-probe-878
          git show FETCH_HEAD:.github/probes/878/apply-slice3.py > /tmp/apply-readiness-878-slice3.py
          python3 /tmp/apply-readiness-878-slice3.py

      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            scripts/component-production/structured-validation.ts \
            scripts/component-production/structured-validation.test.ts

      - name: Guard exact change scope
        shell: bash
        run: |
          actual="$(git status --porcelain=v1 | sed -E 's/^.. //' | sort)"
          expected="$(printf '%s\n' \
            scripts/component-production/structured-validation.test.ts \
            scripts/component-production/structured-validation.ts)"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"
          git diff --name-only | sort > /tmp/readiness-878-slice3-prebuild-files

      - name: Targeted production agreement regressions
        run: |
          pnpm exec vitest run --config vitest.tooling.config.ts \
            scripts/component-production/structured-validation.test.ts \
            scripts/component-production/run.test.ts \
            scripts/component-production/contracts.test.ts

      - name: Tooling typecheck
        run: pnpm typecheck:tooling

      - name: Full tooling tests
        run: pnpm test:tooling

      - name: Source quality
        run: pnpm ci:quality

      - name: Workspace build
        run: pnpm ci:build

      - name: Guard build mutation boundary
        shell: bash
        run: |
          actual="$(git diff --name-only | sort)"
          expected_base="$(cat /tmp/readiness-878-slice3-prebuild-files)"
          expected_with_known_token_drift="$(printf '%s\n' \
            packages/tokens/src/generated/token-types.ts \
            scripts/component-production/structured-validation.test.ts \
            scripts/component-production/structured-validation.ts)"

          if [ "$actual" = "$expected_with_known_token_drift" ]; then
            git restore -- packages/tokens/src/generated/token-types.ts
          else
            test "$actual" = "$expected_base"
          fi

          restored="$(git diff --name-only | sort)"
          test "$restored" = "$expected_base"

      - name: Diff safety
        run: git diff --check

      - name: Guard target head before push
        shell: bash
        run: |
          git fetch origin feat/component-production-readiness-878
          test "$(git rev-parse origin/feat/component-production-readiness-878)" = "72699c0b611ef223ff86939ea80322e845aad9b3"

      - name: Commit and push slice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/component-production/structured-validation.ts \
            scripts/component-production/structured-validation.test.ts
          git diff --cached --check
          git commit -m "feat(tooling): enforce production contract agreement"
          git push origin HEAD:feat/component-production-readiness-878
