name: Component Production Readiness Slice 1 878

on:
  push:
    branches:
      - chore/component-production-readiness-probe-878

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/component-production-readiness-878
          fetch-depth: 0
      - name: Guard exact target head
        run: test "$(git rev-parse HEAD)" = "f7e3ce33d97aaf28c170c038998e025a77a53557"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Load and apply guarded patch
        shell: bash
        run: |
          git fetch origin chore/component-production-readiness-probe-878
          mkdir -p /tmp/readiness878
          git show FETCH_HEAD:.github/probes/878/apply.py > /tmp/readiness878/apply.py
          git show FETCH_HEAD:.github/probes/878/run.ts > /tmp/readiness878/run.ts
          git show FETCH_HEAD:.github/probes/878/final-validation.ts > /tmp/readiness878/final-validation.ts
          git show FETCH_HEAD:.github/probes/878/final-validation.test.ts > /tmp/readiness878/final-validation.test.ts
          python3 /tmp/readiness878/apply.py /tmp/readiness878
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            package.json \
            scripts/component-production/contracts.ts \
            scripts/component-production/command-validation.ts \
            scripts/component-production/command-validation.test.ts \
            scripts/component-production/run.ts \
            scripts/component-production/run.test.ts \
            scripts/component-production/final-validation.ts \
            scripts/component-production/final-validation.test.ts
      - name: Guard exact change scope
        shell: bash
        run: |
          actual="$(git status --porcelain=v1 | sed -E 's/^.. //' | sort)"
          expected="$(printf '%s\n' \
            package.json \
            scripts/component-production/command-validation.test.ts \
            scripts/component-production/command-validation.ts \
            scripts/component-production/contracts.ts \
            scripts/component-production/final-validation.test.ts \
            scripts/component-production/final-validation.ts \
            scripts/component-production/run.test.ts \
            scripts/component-production/run.ts)"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"
      - name: Targeted readiness regressions
        run: |
          pnpm exec vitest run --config vitest.tooling.config.ts \
            scripts/component-production/command-validation.test.ts \
            scripts/component-production/final-validation.test.ts \
            scripts/component-production/run.test.ts \
            scripts/component-production/contracts.test.ts
      - name: Tooling typecheck
        run: pnpm typecheck:tooling
      - name: Workspace build
        run: pnpm ci:build
      - name: Root unit test path
        run: pnpm test:unit
      - name: Quality
        run: pnpm ci:quality
      - name: Diff safety
        run: git diff --check && git diff --no-index /dev/null scripts/component-production/final-validation.ts >/dev/null || test $? -eq 1
      - name: Guard target head before push
        shell: bash
        run: |
          git fetch origin feat/component-production-readiness-878
          test "$(git rev-parse origin/feat/component-production-readiness-878)" = "f7e3ce33d97aaf28c170c038998e025a77a53557"
      - name: Commit and push slice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            scripts/component-production/contracts.ts \
            scripts/component-production/command-validation.ts \
            scripts/component-production/command-validation.test.ts \
            scripts/component-production/run.ts \
            scripts/component-production/run.test.ts \
            scripts/component-production/final-validation.ts \
            scripts/component-production/final-validation.test.ts
          git diff --cached --check
          git commit -m "feat(ci): extend component readiness gates"
          git push origin HEAD:feat/component-production-readiness-878
