name: Component Production Readiness Slice 2 878

on:
  push:
    branches:
      - chore/component-production-readiness-probe-878

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/component-production-readiness-878
          fetch-depth: 0
      - name: Guard exact target head
        run: test "$(git rev-parse HEAD)" = "feec1bd64613b698cd07b8d4a7325fed4a03d28b"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Load and apply guarded patch
        shell: bash
        run: |
          git fetch origin chore/component-production-readiness-probe-878
          git show FETCH_HEAD:.github/probes/878/apply-slice2.py > /tmp/apply-readiness-878-slice2.py
          git show FETCH_HEAD:.github/probes/878/repair-slice2-preflight.py > /tmp/repair-readiness-878-preflight.py
          git show FETCH_HEAD:.github/probes/878/repair-slice2-fixtures.py > /tmp/repair-readiness-878-fixtures.py
          git show FETCH_HEAD:.github/probes/878/repair-slice2-full-suite.py > /tmp/repair-readiness-878-full-suite.py
          git show FETCH_HEAD:.github/probes/878/repair-slice2-type-ownership.py > /tmp/repair-readiness-878-type-ownership.py
          python3 /tmp/apply-readiness-878-slice2.py
          python3 /tmp/repair-readiness-878-preflight.py
          python3 /tmp/repair-readiness-878-fixtures.py
          python3 /tmp/repair-readiness-878-full-suite.py
          python3 /tmp/repair-readiness-878-type-ownership.py
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            scripts/generators/component/preflight.ts \
            scripts/checks/component-completeness/types.ts \
            scripts/checks/component-completeness/check-component.ts \
            scripts/checks/component-completeness/check-component.test.ts \
            scripts/checks/component-completeness/check-test-coverage-integration.test.ts \
            scripts/checks/component-completeness/cli.test.ts
      - name: Guard exact change scope
        shell: bash
        run: |
          actual="$(git status --porcelain=v1 | sed -E 's/^.. //' | sort)"
          expected="$(printf '%s\n' \
            scripts/checks/component-completeness/check-component.test.ts \
            scripts/checks/component-completeness/check-component.ts \
            scripts/checks/component-completeness/check-test-coverage-integration.test.ts \
            scripts/checks/component-completeness/cli.test.ts \
            scripts/checks/component-completeness/types.ts \
            scripts/generators/component/preflight.ts)"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"
      - name: Targeted structural regressions
        run: |
          pnpm exec vitest run --config vitest.tooling.config.ts \
            scripts/checks/component-completeness/check-component.test.ts \
            scripts/checks/component-completeness/check-test-coverage-integration.test.ts \
            scripts/checks/component-completeness/cli.test.ts \
            scripts/component-production/cli.integration.test.ts \
            scripts/generators/component/production-preflight-contract.test.ts
      - name: Workspace build
        run: pnpm ci:build
      - name: Tooling typecheck
        run: pnpm typecheck:tooling
      - name: Full tooling tests
        run: pnpm test:tooling
      - name: Quality and real-repo completeness
        run: pnpm ci:quality
      - name: Diff safety
        run: git diff --check
      - name: Guard target head before push
        shell: bash
        run: |
          git fetch origin feat/component-production-readiness-878
          test "$(git rev-parse origin/feat/component-production-readiness-878)" = "feec1bd64613b698cd07b8d4a7325fed4a03d28b"
      - name: Commit and push slice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/generators/component/preflight.ts \
            scripts/checks/component-completeness/types.ts \
            scripts/checks/component-completeness/check-component.ts \
            scripts/checks/component-completeness/check-component.test.ts \
            scripts/checks/component-completeness/check-test-coverage-integration.test.ts \
            scripts/checks/component-completeness/cli.test.ts
          git diff --cached --check
          git commit -m "feat(tooling): enforce structural production authorities"
          git push origin HEAD:feat/component-production-readiness-878
