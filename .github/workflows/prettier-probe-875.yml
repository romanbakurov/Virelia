name: Tooling Fixture Fix 875

on:
  push:
    branches:
      - chore/prettier-probe-875

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/compound-shared-types
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply stale fixture type ownership patch
        run: |
          test "$(git rev-parse HEAD)" = "11be350e2e612bd556fa0dc4ee61de9654355378"
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('scripts/component-production/generation.test.ts'): (
                  "    control: 'value',\n    capabilities: [],",
                  "    control: 'value',\n    typeOwnership: 'platform',\n    capabilities: [],",
              ),
              Path('scripts/generators/component/resolve-part-templates.test.ts'): (
                  "  control: 'value',\n  capabilities: [],",
                  "  control: 'value',\n  typeOwnership: 'shared',\n  capabilities: [],",
              ),
              Path('scripts/generators/component/resolve-templates.test.ts'): (
                  "  control,\n  capabilities: [],",
                  "  control,\n  typeOwnership: profile === 'base' ? 'platform' : 'shared',\n  capabilities: [],",
              ),
          }

          for path, (old, new) in replacements.items():
              source = path.read_text()
              if source.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one fixture insertion point')
              path.write_text(source.replace(old, new, 1))
          PY
          pnpm exec prettier \
            scripts/component-production/generation.test.ts \
            scripts/generators/component/resolve-part-templates.test.ts \
            scripts/generators/component/resolve-templates.test.ts \
            --write
          git diff --check
      - name: Build workspace before tooling typecheck
        run: pnpm ci:build
      - name: Validate tooling typecheck
        run: pnpm typecheck:tooling
      - name: Validate targeted tooling tests
        run: |
          pnpm exec vitest run --config vitest.tooling.config.ts \
            scripts/component-production/generation.test.ts \
            scripts/generators/component/resolve-part-templates.test.ts \
            scripts/generators/component/resolve-templates.test.ts
      - name: Commit fixture typing patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/component-production/generation.test.ts \
            scripts/generators/component/resolve-part-templates.test.ts \
            scripts/generators/component/resolve-templates.test.ts
          git diff --cached --check
          git commit -m "test(generator): sync type ownership fixtures"
          git push origin HEAD:fix/compound-shared-types
