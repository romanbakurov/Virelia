name: ESLint Apply 875

on:
  push:
    branches:
      - chore/prettier-probe-875

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/compound-shared-types
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository ESLint autofix to Accordion imports
        run: |
          pnpm exec eslint packages/react/src/components/Accordion/Accordion.tsx --fix
          pnpm exec eslint packages/react/src/components/Accordion/Accordion.tsx
          pnpm exec prettier packages/react/src/components/Accordion/Accordion.tsx --check
      - name: Commit import-order-only patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          if git diff --quiet; then
            echo "No ESLint autofix changes required."
            exit 0
          fi
          git add packages/react/src/components/Accordion/Accordion.tsx
          git diff --cached --check
          git commit -m "style(accordion): apply eslint import ordering"
          git push origin HEAD:fix/compound-shared-types
