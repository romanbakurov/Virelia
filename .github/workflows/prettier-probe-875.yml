name: Tooling Fixture Ownership Fix 875

on:
  push:
    branches:
      - chore/prettier-probe-875

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/compound-shared-types
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply shared-type fixture and assertion sync
        run: |
          test "$(git rev-parse HEAD)" = "3787c90854ba3b7a6fa6fac4d57b244f660a27bd"
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_str: str, old: str, new: str) -> None:
              path = Path(path_str)
              source = path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement, found {count}')
              path.write_text(source.replace(old, new, 1))

          replace_once(
              'scripts/generators/component/preflight.test.ts',
              "    fs.writeFileSync(path.join(layerDir, 'index.ts'), '');\n  }\n\n  const metadataDir = path.join(",
              "    fs.writeFileSync(path.join(layerDir, 'index.ts'), '');\n  }\n\n  const sharedTypesDir = path.join(root, 'packages', 'types', 'src');\n\n  fs.mkdirSync(sharedTypesDir, { recursive: true });\n  fs.writeFileSync(path.join(sharedTypesDir, 'index.ts'), '');\n\n  const metadataDir = path.join(",
          )

          replace_once(
              'scripts/generators/component/run.test.ts',
              "    fs.writeFileSync(path.join(root, 'packages', packageName, 'API.md'), '');\n  }\n\n  const metadataDir = path.join(",
              "    fs.writeFileSync(path.join(root, 'packages', packageName, 'API.md'), '');\n  }\n\n  const sharedTypesDir = path.join(root, 'packages', 'types', 'src');\n\n  fs.mkdirSync(sharedTypesDir, { recursive: true });\n  fs.writeFileSync(path.join(sharedTypesDir, 'index.ts'), '');\n\n  const metadataDir = path.join(",
          )

          replace_once(
              'scripts/generators/component/templates/component-part.test.ts',
              "    expect(result).toContain('export type AccordionTriggerProps');\n    expect(result).toContain('disabled?: boolean');\n    expect(result).toContain('onActivate?: () => void');",
              "    expect(result).toContain(\n      \"import type { BaseAccordionTriggerProps } from '@vellira-ui/types';\"\n    );\n    expect(result).toContain(\n      'export type AccordionTriggerProps = BaseAccordionTriggerProps & {'\n    );\n    expect(result).toContain('children?: ReactNode');\n    expect(result).not.toContain('disabled?: boolean');\n    expect(result).not.toContain('onActivate?: () => void');",
          )

          replace_once(
              'scripts/generators/component/templates/component-part.test.ts',
              "    expect(result).toContain('export type AccordionContentProps');\n    expect(result).toContain('hidden?: boolean');",
              "    expect(result).toContain(\n      \"import type { BaseAccordionContentProps } from '@vellira-ui/types';\"\n    );\n    expect(result).toContain(\n      'export type AccordionContentProps = BaseAccordionContentProps & {'\n    );\n    expect(result).toContain('children?: ReactNode');\n    expect(result).not.toContain('hidden?: boolean');",
          )
          PY
          pnpm exec prettier \
            scripts/generators/component/preflight.test.ts \
            scripts/generators/component/run.test.ts \
            scripts/generators/component/templates/component-part.test.ts \
            --write
          git diff --check
      - name: Build workspace
        run: pnpm ci:build
      - name: Validate targeted tooling tests
        run: |
          pnpm exec vitest run --config vitest.tooling.config.ts \
            scripts/generators/component/preflight.test.ts \
            scripts/generators/component/run.test.ts \
            scripts/generators/component/templates/component-part.test.ts
      - name: Validate full tooling suite
        run: pnpm exec vitest run --config vitest.tooling.config.ts
      - name: Commit test-only patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/generators/component/preflight.test.ts \
            scripts/generators/component/run.test.ts \
            scripts/generators/component/templates/component-part.test.ts
          git diff --cached --check
          git commit -m "test(generator): sync shared type ownership fixtures"
          git push origin HEAD:fix/compound-shared-types
