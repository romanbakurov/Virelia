name: Accordion Page Generate 875

on:
  push:
    branches:
      - chore/prettier-probe-875

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/compound-shared-types
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate Accordion component page
        run: |
          pnpm create:component-page Accordion --force
          pnpm create:component-page Accordion --force --check
          pnpm exec prettier \
            apps/website/src/component-catalog/components/Accordion/AccordionDemo.tsx \
            apps/website/src/component-catalog/components/Accordion/AccordionPlayground.tsx \
            apps/website/src/component-catalog/components/Accordion/AccordionUsage.tsx \
            apps/website/src/component-catalog/components/Accordion/NativeAccordionDemo.tsx \
            apps/website/src/component-catalog/components/Accordion/accordionApi.ts \
            apps/website/src/component-catalog/components/Accordion/accordionPlaygroundSchema.ts \
            --check
      - name: Commit generator-owned Accordion page output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          if git diff --quiet; then
            echo "No generated Accordion page changes required."
            exit 0
          fi
          git add \
            apps/website/src/component-catalog/components/Accordion/AccordionDemo.tsx \
            apps/website/src/component-catalog/components/Accordion/AccordionPlayground.tsx \
            apps/website/src/component-catalog/components/Accordion/AccordionUsage.tsx \
            apps/website/src/component-catalog/components/Accordion/NativeAccordionDemo.tsx \
            apps/website/src/component-catalog/components/Accordion/accordionApi.ts \
            apps/website/src/component-catalog/components/Accordion/accordionPlaygroundSchema.ts
          git diff --cached --check
          git commit -m "chore(accordion): regenerate component page"
          git push origin HEAD:fix/compound-shared-types
