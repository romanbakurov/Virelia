name: Generate Switch Pilot

on:
  push:
    branches:
      - feat/switch-generator-v2-pilot

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Switch through canonical Generator V2
        run: pnpm create:component Switch both primitives form --profile=form-control --control=boolean

      - name: Commit generated scaffold
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/react packages/react-native packages/metadata
          git commit -m "feat(components): generate Switch pilot scaffold"
          git push
