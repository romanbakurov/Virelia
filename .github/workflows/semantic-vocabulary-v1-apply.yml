name: Semantic Vocabulary V1 Apply

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/semantic-vocabulary-v1

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/semantic-vocabulary-v1
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Semantic Vocabulary V1 in workspace
        run: |
          python3 scripts/token-semantic-vocabulary-v1-apply.py
          python3 scripts/token-semantic-vocabulary-v1-fixup.py
          python3 scripts/token-semantic-vocabulary-v1-manifest.py

      - name: Assert no legacy authored references remain
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E 'surface\.background|action\.(secondary|close)|icons\.(primary|hover)|status\.[A-Za-z]+\.strong|border\.focus|overlay\.(popover|modal)|semantic\.navigation' -- \
            ':!packages/tokens/src/generated/**' \
            ':!packages/tokens/src/preservation/**' \
            ':!scripts/token-semantic-vocabulary-v1-apply.py' \
            ':!scripts/token-semantic-vocabulary-v1-fixup.py' \
            ':!scripts/token-semantic-vocabulary-v1-manifest.py'; then
            echo 'Legacy semantic vocabulary remains in authored sources.' >&2
            exit 1
          fi

      - name: Format changed authored sources
        run: |
          pnpm exec prettier --write \
            packages/tokens/src/token-architecture.ts \
            packages/tokens/src/semantic-vocabulary-v1.test.ts \
            packages/tokens/src/preservation/token-migrations.ts \
            packages/tokens/src/light/semantic \
            packages/tokens/src/dark/semantic \
            packages/tokens/src/highContrast/semantic \
            packages/tokens/src/light/components \
            packages/tokens/src/dark/components \
            packages/tokens/src/highContrast/components \
            packages/tokens/src/factories \
            apps/native-playground \
            docs/TOKEN_CONVENTIONS.md \
            docs/architecture/token-semantic-vocabulary-v1.md

      - name: Generate token outputs
        run: pnpm --filter @vellira-ui/tokens build:tokens

      - name: Structural TypeScript validation
        run: |
          pnpm --filter @vellira-ui/tokens exec tsc -p tsconfig.json --noEmit
          pnpm --filter @vellira-ui/tokens exec tsc -p tsconfig.scripts.json --noEmit

      - name: Token Vitest without preservation precheck
        run: pnpm --filter @vellira-ui/tokens exec vitest run

      - name: Preservation evidence probe
        run: pnpm --filter @vellira-ui/tokens preservation:check
