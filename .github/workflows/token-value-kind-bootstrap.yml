name: Token Value Kind Bootstrap

on:
  push:
    branches:
      - fix/token-value-kinds-v1
    paths:
      - 'packages/tokens/**'
      - 'scripts/generators/component/**'
      - '.github/workflows/token-value-kind-bootstrap.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/token-value-kinds-v1
      - name: Finalize preservation and duration routing
        run: |
          python - <<'PY'
          from pathlib import Path

          architecture = Path('packages/tokens/src/token-architecture.ts')
          content = architecture.read_text()
          old = "  'line-height': ['lineHeight'],\n  length: ["
          new = "  'line-height': ['lineHeight'],\n  duration: ['duration'],\n  length: ["
          if old not in content:
              raise SystemExit('token architecture duration insertion point not found')
          architecture.write_text(content.replace(old, new, 1))

          preservation = Path('packages/tokens/scripts/token-preservation.ts')
          content = preservation.read_text()
          old = """  if (migration.kind === 'representation-change') {
            if (context === 'canonical') {
              return migration.layer === 'canonical';
            }

            return (
              migration.layer === 'platform-output' &&
              migration.platforms.includes(context)
            );
          }
          """
          new = """  if (migration.kind === 'representation-change') {
            if (migration.layer === 'canonical') {
              return context === 'canonical' || context === 'react-native';
            }

            return context !== 'canonical' && migration.platforms.includes(context);
          }
          """
          if old not in content:
              raise SystemExit('preservation representation routing block not found')
          preservation.write_text(content.replace(old, new, 1))
          PY
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format value-kind implementation
        run: >-
          pnpm prettier
          packages/tokens/src/token-architecture.ts
          packages/tokens/scripts/token-css-output.ts
          packages/tokens/src/factories/createModalTokens.ts
          packages/tokens/src/preservation/token-migrations.ts
          packages/tokens/scripts/token-css-output.test.ts
          packages/tokens/src/token-value-kinds.test.ts
          packages/tokens/scripts/token-preservation-routing.test.ts
          packages/tokens/scripts/token-preservation.ts
          scripts/generators/component/token-value-kinds.ts
          scripts/generators/component/templates/component-tokens.ts
          scripts/generators/component/token-value-kinds.test.ts
          --write
      - name: Commit exact sources and remove bootstrap workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/tokens/src/token-architecture.ts \
            packages/tokens/scripts/token-css-output.ts \
            packages/tokens/src/factories/createModalTokens.ts \
            packages/tokens/src/preservation/token-migrations.ts \
            packages/tokens/scripts/token-css-output.test.ts \
            packages/tokens/src/token-value-kinds.test.ts \
            packages/tokens/scripts/token-preservation-routing.test.ts \
            packages/tokens/scripts/token-preservation.ts \
            scripts/generators/component/token-value-kinds.ts \
            scripts/generators/component/templates/component-tokens.ts \
            scripts/generators/component/token-value-kinds.test.ts
          git rm .github/workflows/token-value-kind-bootstrap.yml
          git commit -m 'test(tokens): validate value-kind authority'
          git push origin HEAD:fix/token-value-kinds-v1
      - name: Run token package tests
        run: pnpm --filter @vellira-ui/tokens test
      - name: Run tooling tests
        run: pnpm test:tooling
