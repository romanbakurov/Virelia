packages:
  - 'packages/*'
  - 'apps/*'
allowBuilds:
  '@parcel/watcher': true
  deasync: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - '@storybook/addon-ondevice-actions@10.4.5'
  - '@storybook/addon-ondevice-controls@10.4.5'
  - '@storybook/react-native-theming@10.4.5'
  - '@storybook/react-native-ui-common@10.4.5'
  - '@storybook/react-native-ui-lite@10.4.5'
  - '@storybook/react-native-ui@10.4.5'
  - '@storybook/react-native@10.4.5'
nodeLinker: hoisted

overrides:
  'brace-expansion@<1.1.16': 1.1.16
  'esbuild@<=0.24.2': 0.28.1
  'fast-uri@>=3.0.0 <=3.1.3': 3.1.4
  'minimatch@10>brace-expansion': 5.0.8
  'postcss@<=8.5.17': 8.5.22
  react: 19.2.3
  react-dom: 19.2.3
  sharp: 0.35.3
  'uuid@<11.1.1': 11.1.1
  'valibot@<=1.4.1': 1.4.2
  'vite@<=6.4.2': 6.4.3
